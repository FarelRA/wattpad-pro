<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wattpad Story Fetcher & Enhancer</title>
    <!-- Turndown library for HTML to Markdown -->
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <style>
      /* --- Base Variables --- */
      :root {
        --primary-color: #ff6600; /* Wattpad orange */
        --primary-hover-color: #e65c00;
        --primary-active-color: #cc5200;
        --secondary-color: #3a86ff; /* A blue for AI actions */
        --secondary-hover-color: #3375e0;
        --secondary-active-color: #2c64c2;
        --border-radius: 8px;
        --transition-speed: 0.2s ease;
        --shadow-opacity-light: 0.08;
        --shadow-opacity-dark: 0.25;
        --spinner-size: 1em;
      }

      /* --- Light Mode --- */
      html[data-theme='light'] {
        --bg-color: #f4f5f7; /* Lighter gray */
        --text-color: #2c3e50; /* Dark blue-gray */
        --secondary-bg-color: #ffffff;
        --input-bg-color: #ffffff;
        --input-border-color: #dcdfe6;
        --input-focus-border-color: var(--primary-color);
        --heading-color: #34495e; /* Slightly darker blue-gray */
        --subtle-text-color: #8492a6;
        --button-text-color: #ffffff;
        --link-color: var(--primary-color);
        --separator-color: #e4e7ed;
        --shadow-color: rgba(44, 62, 80, var(--shadow-opacity-light));
        --error-bg: #fef0f0;
        --error-text: #f56c6c;
        --error-border: #fde2e2;
        --success-bg: #f0f9eb;
        --success-text: #67c23a;
        --success-border: #e1f3d8;
        --info-bg: #f4f4f5;
        --info-text: #909399;
        --info-border: #e9e9eb;
        --theme-toggle-bg: #e9ecef;
        --theme-toggle-hover-bg: #ced4da;
        --placeholder-text-color: #aab0c4;
        --card-bg: #ffffff;
        --card-border: #e4e7ed;
        --tag-bg: #ecf5ff;
        --tag-text: #409eff;
        --tag-border: #d9ecff;
      }

      /* --- Dark Mode (Now Default) --- */
      html[data-theme='dark'] {
        --bg-color: #1c1e21;
        --text-color: #e4e6eb;
        --secondary-bg-color: #242526;
        --input-bg-color: #3a3b3c;
        --input-border-color: #4b4d4f;
        --input-focus-border-color: var(--primary-color);
        --heading-color: #ccd0d5;
        --subtle-text-color: #a0a3a8;
        --link-color: #ff8c4f; /* Lighter orange for dark mode */
        --separator-color: #3e4042;
        --shadow-color: rgba(0, 0, 0, var(--shadow-opacity-dark));
        --error-bg: #3a2a2a;
        --error-text: #f2aaaa;
        --error-border: #5a3a3a;
        --success-bg: #2a4a2a;
        --success-text: #aaffee;
        --success-border: #4a8a4a;
        --info-bg: #3a3a3a;
        --info-text: #b0b3b8;
        --info-border: #555;
        --theme-toggle-bg: #3a3b3c;
        --theme-toggle-hover-bg: #4e4f50;
        --placeholder-text-color: #6a6d71;
        --card-bg: #2d2e2f;
        --card-border: #3e4042;
        --tag-bg: #2a3a4a;
        --tag-text: #73b4ff;
        --tag-border: #3a5a7a;
      }

      /* --- Global Styles --- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji',
          'Segoe UI Emoji';
        line-height: 1.6;
        color: var(--text-color);
        background-color: var(--bg-color);
        margin: 0;
        padding: 25px;
        transition:
          background-color var(--transition-speed),
          color var(--transition-speed);
      }

      .container {
        max-width: 900px;
        margin: 20px auto;
        background-color: var(--secondary-bg-color);
        padding: 35px 40px;
        border-radius: var(--border-radius);
        box-shadow: 0 5px 20px var(--shadow-color);
        transition: background-color var(--transition-speed);
      }

      /* --- Typography --- */
      h1,
      h2,
      h3,
      h4 {
        color: var(--heading-color);
      }
      h1 {
        margin-top: 0;
        text-align: center;
        color: var(--primary-color);
      }
      h2 {
        padding-bottom: 0.4em;
        border-bottom: 1px solid var(--separator-color);
      }
      h3 {
        font-size: 1.35em;
      }
      h4 {
        font-size: 1.15em;
      }
      a {
        color: var(--link-color);
        text-decoration: none;
        transition: color var(--transition-speed);
      }
      a:hover {
        text-decoration: underline;
        color: var(--primary-hover-color);
      }
      p {
        margin-bottom: 1em;
      }
      hr {
        border: none;
        border-top: 1px solid var(--separator-color);
        margin: 25px 0;
      }

      /* --- Sections & Layout --- */
      .input-controls {
        margin-bottom: 25px;
      }
      .action-buttons {
        padding-top: 25px;
        border-top: 1px solid var(--separator-color);
        margin-top: 25px;
      }
      .output-section {
        margin-top: 25px;
      }
      .button-group {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .chapter-selection-controls {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px;
        flex-wrap: wrap;
        padding: 15px;
        background-color: var(--bg-color);
        border-radius: var(--border-radius);
        border: 1px solid var(--card-border);
      }

      /* --- Forms & Inputs --- */
      .input-group {
        margin-bottom: 20px;
      }
      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--subtle-text-color);
        font-size: 0.9em;
      }
      .input-group input[type='text'],
      .input-group input[type='password'] {
        padding: 12px 15px;
        border: 1px solid var(--input-border-color);
        border-radius: var(--border-radius);
        font-size: 1em;
        width: 100%;
        background-color: var(--input-bg-color);
        color: var(--text-color);
        transition:
          border-color var(--transition-speed),
          background-color var(--transition-speed),
          box-shadow var(--transition-speed);
        font-family: inherit;
      }
      .input-group input[type='text']:focus,
      .input-group input[type='password']:focus {
        outline: none;
        border-color: var(--input-focus-border-color);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-color) 15%, transparent);
      }
      .input-group input::placeholder {
        color: var(--placeholder-text-color);
      }
      .chapter-selection-controls label {
        margin-bottom: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-size: 0.9em;
      }
      .chapter-selection-controls input[type='checkbox'] {
        width: 18px;
        height: 18px;
        accent-color: var(--primary-color);
      }
      .chapter-selection-controls input[type='text'] {
        padding: 8px 12px;
        width: 220px;
        font-size: 0.9em;
      }

      /* --- Buttons --- */
      button {
        background-color: var(--primary-color);
        color: var(--button-text-color);
        border: none;
        padding: 10px 20px;
        border-radius: var(--border-radius);
        cursor: pointer;
        font-size: 0.95em;
        font-weight: 500;
        transition:
          background-color var(--transition-speed),
          transform var(--transition-speed),
          opacity var(--transition-speed);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        line-height: 1.4;
        white-space: nowrap;
      }
      button:hover:not(:disabled) {
        background-color: var(--primary-hover-color);
        transform: translateY(-1px);
      }
      button:active:not(:disabled) {
        background-color: var(--primary-active-color);
        transform: translateY(0px);
      }
      button:disabled {
        background-color: #a0aec0;
        cursor: not-allowed;
        opacity: 0.7;
      }
      button.ai-button {
        background-color: var(--secondary-color);
      }
      button.ai-button:hover:not(:disabled) {
        background-color: var(--secondary-hover-color);
      }
      button.ai-button:active:not(:disabled) {
        background-color: var(--secondary-active-color);
      }
      button .spinner {
        display: none;
      }
      button.loading .spinner {
        display: inline-block;
      }
      button.loading span:not(.spinner) {
        margin-left: 5px;
      }

      /* --- Split Button & Dropdown Styles --- */
      .split-button-container {
        position: relative;
        display: inline-flex;
      }
      #rewrite-chapters-button {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
        border-right: 1px solid color-mix(in srgb, var(--secondary-active-color) 80%, white);
      }
      #prompt-dropdown-toggle {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
        padding: 10px 12px;
        font-size: 0.8em;
      }
      .prompt-dropdown {
        position: absolute;
        top: 105%;
        left: 0;
        z-index: 10;
        background-color: var(--secondary-bg-color);
        border: 1px solid var(--card-border);
        border-radius: var(--border-radius);
        box-shadow: 0 4px 12px var(--shadow-color);
        list-style: none;
        margin: 0;
        padding: 6px;
        min-width: 250px;
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.15s ease, transform 0.15s ease;
        pointer-events: none;
      }
      .prompt-dropdown:not(.hidden) {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      .prompt-item {
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color var(--transition-speed);
        font-size: 0.9em;
      }
      .prompt-item:hover {
        background-color: var(--bg-color);
      }
      .prompt-item.active {
        background-color: var(--secondary-color);
        color: var(--button-text-color);
      }
      #theme-toggle {
        background-color: var(--theme-toggle-bg);
        color: var(--text-color);
        margin-left: auto;
        font-size: 1.1em;
        padding: 8px 12px;
        line-height: 1;
      }
      #theme-toggle:hover {
        background-color: var(--theme-toggle-hover-bg);
      }
      .chapter-selection-controls button {
        padding: 6px 14px;
        font-size: 0.85em;
        background-color: var(--info-bg);
        color: var(--info-text);
        border: 1px solid var(--info-border);
      }
      .chapter-selection-controls button:hover:not(:disabled) {
        background-color: color-mix(in srgb, var(--info-bg) 85%, black);
        transform: none;
      }
      .chapter-selection-controls button:active:not(:disabled) {
        background-color: color-mix(in srgb, var(--info-bg) 75%, black);
      }

      /* --- Status Messages --- */
      #status {
        margin: 20px 0;
        padding: 14px 18px;
        border-radius: var(--border-radius);
        font-weight: 500;
        border: 1px solid transparent;
        display: none;
      }
      #status.error {
        background-color: var(--error-bg);
        color: var(--error-text);
        border-color: var(--error-border);
      }
      #status.success {
        background-color: var(--success-bg);
        color: var(--success-text);
        border-color: var(--success-border);
      }
      #status.info {
        background-color: var(--info-bg);
        color: var(--info-text);
        border-color: var(--info-border);
      }

      /* --- Metadata Display --- */
      #metadata-display .metadata-header {
        display: flex;
        gap: 25px;
        align-items: center;
        margin-bottom: 25px;
      }
      #metadata-display .cover-image {
        max-width: 150px;
        height: auto;
        border-radius: var(--border-radius);
        border: 1px solid var(--card-border);
        display: block;
      }
      #metadata-display .metadata-info {
        flex-grow: 1;
      }
      #metadata-display .metadata-info h3 {
        margin-top: 0;
        margin-bottom: 0.5em;
        font-size: 1.5em;
      }
      #metadata-display .author-info {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
        color: var(--subtle-text-color);
        font-size: 0.95em;
      }
      #metadata-display .author-avatar {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        border: 1px solid var(--card-border);
        object-fit: cover;
      }
      #metadata-display .description-text {
        white-space: pre-wrap;
        font-size: 0.95em;
        line-height: 1.6;
        margin-bottom: 1.5em;
        margin-top: 0.5em;
      }
      #metadata-display .metadata-details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 15px;
        font-size: 0.9em;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--separator-color);
      }
      #metadata-display .detail-item span:first-child {
        font-weight: 600;
        color: var(--subtle-text-color);
        display: block;
        margin-bottom: 3px;
      }
      #metadata-display .tags-container {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--separator-color);
      }
      #metadata-display .tag-item {
        display: inline-block;
        background-color: var(--tag-bg);
        color: var(--tag-text);
        border: 1px solid var(--tag-border);
        padding: 3px 10px;
        border-radius: 15px;
        margin: 3px;
        font-size: 0.85em;
      }

      /* --- Chapter Selection List --- */
      #chapter-list-container {
        margin-top: 25px;
      }
      #chapter-list {
        list-style-type: none;
        padding: 0;
        margin: 0;
        max-height: 450px;
        overflow-y: auto;
        border: 1px solid var(--card-border);
        border-radius: var(--border-radius);
        padding: 10px;
        background-color: var(--bg-color);
      }
      #chapter-list li {
        background-color: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--border-radius);
        padding: 12px 18px;
        margin-bottom: 8px;
        transition: background-color var(--transition-speed);
        display: flex;
        align-items: center;
        gap: 15px;
      }
      #chapter-list li:hover {
        background-color: var(--secondary-bg-color);
      }
      .chapter-item-checkbox {
        width: 20px;
        height: 20px;
        cursor: pointer;
        flex-shrink: 0;
        accent-color: var(--primary-color);
      }
      .chapter-item-label {
        flex-grow: 1;
        cursor: pointer;
      }
      .chapter-item-label .chapter-index {
        font-weight: bold;
        color: var(--primary-color);
        margin-right: 5px;
      }
      .chapter-item-details {
        font-size: 0.8em;
        color: var(--subtle-text-color);
        margin-top: 3px;
      }
      .chapter-item-details span + span::before {
        content: '|';
        margin: 0 8px;
        color: var(--separator-color);
      }

      /* --- Chapter Content Display --- */
      .chapter-content {
        margin-top: 20px;
        padding: 25px;
        border: 1px solid var(--card-border);
        border-radius: var(--border-radius);
        background-color: var(--secondary-bg-color);
      }
      .chapter-content h3 {
        margin-top: 0;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--separator-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .ai-enhanced-badge {
        font-size: 0.6em;
        font-weight: bold;
        padding: 4px 8px;
        border-radius: 12px;
        background-color: var(--tag-bg);
        color: var(--tag-text);
        border: 1px solid var(--tag-border);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .chapter-content .chapter-meta-details {
        font-size: 0.85em;
        color: var(--subtle-text-color);
        margin-top: -5px;
        margin-bottom: 20px;
        font-style: italic;
      }
      .chapter-content .content-body {
        font-size: 1.05em;
      }
      .chapter-content.error-placeholder {
        border-color: var(--error-border);
        background-color: var(--error-bg);
      }
      .chapter-content.error-placeholder h3,
      .chapter-content.error-placeholder p {
        color: var(--error-text);
      }

      /* --- Utilities --- */
      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      .hidden {
        display: none !important;
      }

      /* --- Spinner --- */
      .spinner {
        width: var(--spinner-size);
        height: var(--spinner-size);
        border: 2px solid currentColor;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        animation: spinner-rotation 0.75s linear infinite;
      }
      @keyframes spinner-rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Wattpad Story Fetcher & Enhancer</h1>

      <section class="input-controls" aria-labelledby="controls-heading">
        <h2 id="controls-heading" class="sr-only"> Story and AI Configuration </h2>
        <div class="input-group">
          <label for="story-url">Wattpad Story URL</label>
          <input
            type="text"
            id="story-url"
            placeholder="e.g., https://www.wattpad.com/story/123456789-your-story-title"
            required
            aria-required="true"
          />
        </div>
        <div class="input-group">
            <label for="gemini-api-key">Google Gemini API Key</label>
            <input
                type="password"
                id="gemini-api-key"
                placeholder="Enter your API key here"
                aria-label="Google Gemini API Key"
            />
        </div>

        <section class="output-section hidden" id="chapters-section" aria-labelledby="chapters-heading">
          <h2 id="chapters-heading">📚 Select Chapters</h2>
          <div class="chapter-selection-controls">
            <label><input type="checkbox" id="select-all-chapters" disabled /> Select/Deselect All</label>
            <input
              type="text"
              id="chapter-range"
              placeholder="Range (e.g., 1-5, 8, 11-13)"
              title="Enter chapter indices or ranges separated by commas"
              aria-label="Chapter range input"
              disabled
            />
            <button id="apply-range-button" type="button" disabled> Apply Range </button>
          </div>
          <div id="chapter-list-container">
            <ul id="chapter-list" aria-live="polite">
              <li style="text-align: center; color: var(--subtle-text-color); padding: 20px">
                Enter a story URL and click "Fetch Story Info" first.
              </li>
            </ul>
          </div>
        </section>

        <div id="status" role="alert" aria-live="assertive"></div>
      </section>

      <section class="action-buttons" aria-label="Action Buttons">
        <div class="button-group">
          <button id="fetch-metadata-button" type="button">
            <span class="spinner" aria-hidden="true"></span>
            <span>Fetch Story Info</span>
          </button>
          <button id="fetch-chapters-button" type="button" disabled>
            <span class="spinner" aria-hidden="true"></span>
            <span>Fetch Selected Chapters</span>
          </button>

          <div class="split-button-container">
              <button id="rewrite-chapters-button" type="button" class="ai-button" disabled>
                  <span class="spinner" aria-hidden="true"></span>
                  <span id="rewrite-button-text">✨ Rewrite</span>
              </button>
              <button id="prompt-dropdown-toggle" type="button" class="ai-button" disabled aria-haspopup="true" aria-expanded="false">▼</button>
              <ul id="prompt-dropdown" class="prompt-dropdown hidden" role="menu">
                  <!-- Prompt items will be dynamically injected by JavaScript -->
              </ul>
          </div>

          <button id="copy-markdown-button" type="button" disabled>
            <span class="spinner" aria-hidden="true"></span>
            <span>📋 Copy Markdown</span>
          </button>
          <button id="theme-toggle" type="button" title="Toggle Light/Dark Theme"> ☀️ </button>
        </div>
      </section>

      <section class="output-section hidden" id="metadata-section">
        <div id="metadata-display"></div>
      </section>

      <section class="output-section hidden" id="content-section" aria-labelledby="content-heading">
        <h2 id="content-heading">📝 Story Content</h2>
        <div id="story-content-display"></div>
      </section>

      <textarea id="markdown-output" class="sr-only" aria-hidden="true" tabindex="-1"></textarea>
    </div>

    <script>
      /* --- Configuration --- */
      const CONFIG = {
        VERBOSE: true,
        CORS_PROXY: 'https://flare.farel.at.eu.org/conduit/?url=',
        API_BASE: 'https://www.wattpad.com/apiv2/storytext?id=',
        FETCH_TIMEOUT: 4000,

        GEMINI: {
            API_BASE: "https://generativelanguage.googleapis.com/v1beta/models/",
            MODEL_ID: "gemini-2.5-flash",
            API_ACTION: "generateContent",
            FETCH_TIMEOUT: 300000
        },

        PREDEFINED_PROMPTS: {
            'proofread': {
                name: 'Proofread & Fix',
                prompt: 'Please proofread the following HTML content for any grammatical errors, spelling mistakes, and typos. Correct them to improve clarity and readability. Ensure the output is valid HTML and preserves the original tags and structure, only modifying the text content where necessary. Do not change the original style or voice. Output only the modified HTML.'
            },
            'enhance': {
                name: 'Enhance Descriptions',
                prompt: 'Rewrite the following chapter, provided as HTML content, to be more descriptive and engaging. Enhance the sensory details (sight, sound, smell, touch, taste) and improve the pacing. Make the characters\' emotions more palpable. The output must be valid HTML, preserving the original structure and tags, only modifying the text content. Output only the modified HTML.'
            },
            'simplify': {
                name: 'Shorten & Summary',
                prompt: 'Summary the following chapter, provided as HTML content. Summarize into short one sentence.'
            }
        },
        DEFAULT_PROMPT_KEY: 'proofread',

        TURNDOWN: {
          headingStyle: 'atx',
          hr: '---',
          bulletListMarker: '*',
          codeBlockStyle: 'fenced',
          emDelimiter: '_',
          strongDelimiter: '**',
          linkStyle: 'inlined'
        },

        selectors: {
          general: {
            link: ['link[rel="canonical"]'],
            title: ['head > title'],
            cover: ['img[data-testid="image"]'],
            description: ['pre.mpshL._6pPkw'],
            copyright: ['div[data-testid="copyright"]'],
            status: ['div[data-testid="completed-tag"] > div > span'],
            tags: ['div[data-testid="tag-carousel"] a span']
          },
          author: {

      // ==== Global State ====

      // ==== Helper Functions ====
      const log = {
        debug: (message, ...args) => { if (CONFIG.VERBOSE) console.debug(`[D] ${message}`, ...args); },
        info: (message, ...args) => { if (CONFIG.VERBOSE) console.info(`[I] ${message}`, ...args); },

      function showStatus(message, type = 'info', clearAfter = 0) {

      function clearStatus() {
        DOMElements.statusDiv.textContent = '';

      function abortPreviousFetch() {
        if (currentFetchController) {
          currentFetchController.abort();
          log.info('Previous fetch request aborted.');
        }
        currentFetchController = new AbortController();
      }

      async function fetchWithTimeout(url, type = 'resource', options = {}, useProxy = true, timeout = CONFIG.FETCH_TIMEOUT) {
          abortPreviousFetch();
          const { signal } = currentFetchController;

          const finalUrl = useProxy ? `${CONFIG.CORS_PROXY}${encodeURIComponent(url)}` : url;
          log.info(`Fetching ${type} from: ${finalUrl.substring(0, 100)}...`);

          const headers = { 'X-Requested-With': 'XMLHttpRequest', ...options.headers };

          const fetchPromise = fetch(finalUrl, { ...options, headers, signal });
          const timeoutPromise = new Promise((_, reject) =>
              setTimeout(() => reject(new Error(`${type} fetch timed out after ${timeout / 1000}s`)), timeout)
          );

          try {
              const response = await Promise.race([fetchPromise, timeoutPromise]);
              log.info(`Fetch response status for ${type}: ${response.status}`);
              if (!response.ok) {
                  let errorText = `HTTP ${response.status} ${response.statusText}`;
                  try {
                      const errorBody = await response.json();
                      errorText += ` - ${errorBody.error?.message || JSON.stringify(errorBody)}`;
                  } catch (e) {
                      const textBody = await response.text();
                      errorText += ` - ${textBody.substring(0, 150)}...`;
                  }
                  throw new Error(errorText);
              }
              log.info(`Successfully fetched ${type}.`);
              return headers['Content-Type'] === 'application/json' ? await response.json() : await response.text();
          } catch (error) {
              if (error.name === 'AbortError') {
                  log.info(`${type} fetch aborted.`);
                  throw new Error('Fetch aborted by user.');
              }
              log.error(`Fetch ${type} Error: ${error.message}`, error);
              throw error;
          } finally {
              if (currentFetchController && currentFetchController.signal === signal) {
                  currentFetchController = null;
              }
          }
      }

      function queryElement(selectors, parentElement = document) {
        const selectorList = Array.isArray(selectors) ? selectors : [selectors];
        for (const selector of selectorList) {
          try {
            const element = parentElement?.querySelector(selector);
            if (element) return element;
          } catch (e) { /* ignore */ }
        }
        return null;
      }

      function queryAllElements(selectors, parentElement = document) {
        const selectorList = Array.isArray(selectors) ? selectors : [selectors];
        for (const selector of selectorList) {
          try {
            const elements = parentElement?.querySelectorAll(selector);
            if (elements && elements.length > 0) return elements;
          } catch (e) { /* ignore */ }
        }
        return document.querySelectorAll('.never-match-anything-ever');
      }

      function extractStoryId(url) { return url?.match(/\/story\/(\d+)/)?.[1] ?? null; }
      function extractPartId(url) { return url?.match(/\/(\d+)-/)?.[1] ?? null; }

      // ==== Parsing and Display Functions ====

      function parseStoryPage(html, storyUrl) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const metadata = { url: storyUrl, id: null, title: 'Untitled', cover: null, author: { username: 'Unknown', fullname: 'Unknown', profileUrl: null, avatar: null }, description: '*No description provided.*', copyright: 'Unknown', completed: false, tags: [], stats: { reads: 'N/A', votes: 'N/A', parts: 'N/A', time: 'N/A' }, parts: [] };
          try {
              const canonicalUrl = queryElement(CONFIG.selectors.general.link, doc)?.href || storyUrl;
              metadata.url = canonicalUrl;
              metadata.id = extractStoryId(metadata.url);
              const headTitleText = queryElement(CONFIG.selectors.general.title, doc)?.textContent || '';
              const headTitleParts = headTitleText.split(' - ');
              metadata.title = headTitleParts[0]?.trim() || 'Untitled';
              const authorFullnameFromTitle = headTitleParts[1]?.trim() || null;
              metadata.cover = queryElement(CONFIG.selectors.general.cover, doc)?.src || null;
              const authorContainer = queryElement(CONFIG.selectors.author.container, doc);
              if (authorContainer) {
                  metadata.author.profileUrl = queryElement(CONFIG.selectors.author.link, authorContainer)?.href || null;
                  metadata.author.username = queryElement(CONFIG.selectors.author.username, authorContainer)?.textContent?.trim() || 'Unknown';
                  metadata.author.avatar = queryElement(CONFIG.selectors.author.avatar, authorContainer)?.src || null;
              }
              metadata.author.fullname = authorFullnameFromTitle ?? metadata.author.username ?? 'Unknown';
              metadata.description = queryElement(CONFIG.selectors.general.description, doc)?.textContent?.trim() || '*No description provided._';
              metadata.copyright = queryElement(CONFIG.selectors.general.copyright, doc)?.textContent?.trim() || 'Unknown';
              metadata.completed = (queryElement(CONFIG.selectors.general.status, doc)?.textContent || '').toLowerCase().includes('complete');
              metadata.tags = Array.from(new Set(Array.from(queryAllElements(CONFIG.selectors.general.tags, doc)).map(el => el.textContent?.trim()).filter(Boolean)));
              const statsContainer = queryElement(CONFIG.selectors.stats.container, doc);
              if (statsContainer) {
                  queryAllElements(CONFIG.selectors.stats.items, statsContainer).forEach(item => {
                      const type = (queryElement(CONFIG.selectors.stats.type, item)?.textContent || item.textContent || '').toLowerCase().trim();
                      const value = queryElement(CONFIG.selectors.stats.value, item)?.textContent?.trim();
                      if (value) {
                          if (type.includes('read')) metadata.stats.reads = value;
                          else if (type.includes('vote')) metadata.stats.votes = value;
                          else if (type.includes('part')) metadata.stats.parts = value;
                          else if (type.includes('time')) metadata.stats.time = value;
                      }
                  });
              }
              const tocContainer = queryElement(CONFIG.selectors.toc.container, doc);
              if (tocContainer) {
                  queryAllElements(CONFIG.selectors.toc.link, tocContainer).forEach((partLink, index) => {
                      const part = { index: index + 1 };
                      const rawUrl = partLink.getAttribute('href');
                      if (!rawUrl) return;
                      part.url = new URL(rawUrl, metadata.url).href;
                      part.id = extractPartId(part.url);
                      part.title = queryElement(CONFIG.selectors.toc.title, partLink)?.textContent?.trim() || `Part ${part.index}`;
                      part.createDate = queryElement(CONFIG.selectors.toc.date, partLink)?.textContent?.trim() || null;
                      if (part.id && part.url) metadata.parts.push(part);
                  });
              }
              if (metadata.parts.length > 0) {
                  metadata.stats.parts = metadata.parts.length.toString();
              }
              metadata.firstPublishedPartDate = metadata.parts[0]?.createDate ?? null;
              metadata.lastPublishedPartDate = metadata.parts[metadata.parts.length - 1]?.createDate ?? null;
              return metadata;
          } catch (error) {
              log.error('!!! Critical error during metadata parsing !!!', error);
              return { ...metadata, error: `Parsing failed: ${error.message}` };
          }
      }

      function displayMetadata(data) {

        let authorDisplay = `<a href="${author.profileUrl || '#'}" target="_blank" rel="noopener noreferrer">${author.fullname}</a>`;

      function displayChapterContent(partId, partIndex, partTitle, publishDate, htmlContent, isError = false, errorMessage = '', isAiEnhanced = false) {
          let chapterDiv = DOMElements.storyContentDisplay.querySelector(`.chapter-content[data-part-id="${partId}"]`);
          if (!chapterDiv) {
              chapterDiv = document.createElement('div');
              chapterDiv.className = 'chapter-content';
              chapterDiv.setAttribute('data-part-id', partId);
              chapterDiv.setAttribute('data-part-index', partIndex);
              DOMElements.storyContentDisplay.appendChild(chapterDiv);
          }
          chapterDiv.classList.toggle('error-placeholder', isError);
          const aiBadge = isAiEnhanced ? `<span class="ai-enhanced-badge">AI Enhanced</span>` : '';
          const titleHtml = `<h3><span>${partTitle}</span>${aiBadge}</h3>`;
          const metadataLine = `<p class="chapter-meta-details"><em>Part Number: ${partIndex} | Published: ${publishDate || 'N/A'} | ID: ${partId}</em></p>`;
          let contentHtml;
          if (isError) {
              contentHtml = `<div class="content-body"><p style='font-weight: bold;'>❌ ${isAiEnhanced ? 'AI Rewrite Failed' : 'Fetch Failed'}: ${errorMessage}</p></div>`;
          } else {
              // The content received from the API or AI should already be HTML.
              // We'll clean script tags but otherwise display directly.
              const cleanHtml = htmlContent.replace(/<script[^>]*>.*?<\/script>/gis, '');
              contentHtml = `<div class="content-body">${cleanHtml}</div>`;
          }
          chapterDiv.innerHTML = titleHtml + metadataLine + contentHtml;
          DOMElements.contentSection.classList.remove('hidden');
      }

      // MODIFIED: Function to pass original HTML and expect HTML output from AI.
      async function rewriteChapterWithAI(apiKey, prompt, chapterHtml) {
        if (!chapterHtml.trim()) {
            throw new Error('Chapter content is empty or invalid for AI processing.');
        }

        const apiUrl = `${CONFIG.GEMINI.API_BASE}${CONFIG.GEMINI.MODEL_ID}:${CONFIG.GEMINI.API_ACTION}?key=${apiKey}`;

        // Pass the original HTML directly, along with the prompt.
        // The prompt itself should instruct the AI to process HTML and output HTML.
        const requestBody = {
            contents: [
                { role: "user", parts: [{ text: `Original HTML chapter:\n${chapterHtml}` }, { text: prompt }] }
            ]
        };

        const response = await fetchWithTimeout(apiUrl, 'Gemini AI', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
        }, true, CONFIG.GEMINI.FETCH_TIMEOUT);

        const rewrittenContent = response?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rewrittenContent) {
            log.error('Invalid response from Gemini API:', response);
            throw new Error('Could not extract text from Gemini API response. Check API key and model.');
        }

        // The AI is now instructed to output HTML, so return it directly.
        return rewrittenContent;
      }

      function buildMarkdown() {
        if (!storyData || !turndownService) return '';
        const { title, url, author, description, parts, cover, stats, tags, copyright, completed, firstPublishedPartDate, lastPublishedPartDate } = storyData;
        const md = [];
        md.push(`# 📖 [${title}](${url})\n`);
        if (cover) md.push(`![Story Cover](${cover})\n`);
        if (author.avatar) md.push(`![Author Avatar](${author.avatar})\n`);
        let authorDisplayMd = `[${author.fullname}](${author.profileUrl || '#'})`;
        if (author.username && author.username.toLowerCase() !== author.fullname.toLowerCase()) { authorDisplayMd += ` (@${author.username})`; }
        md.push(`**Author:** ${authorDisplayMd}\n\n---\n`);
        md.push(`## 📝 Description\n${description}\n\n`);
        md.push(`## 📊 Story Metadata\n| Detail | Value |\n|---|---|\n`);
        [
          ['Story URL', url], ['Story ID', storyData.id], ['Status', completed ? 'Completed' : 'Ongoing'],
          ['Chapters', stats.parts], ['Reads', stats.reads], ['Votes', stats.votes], ['Time', stats.time],
          ['First Chapter', firstPublishedPartDate], ['Last Chapter', lastPublishedPartDate], ['Copyright', copyright],
          ['Tags', tags.map(t => `\`${t}\``).join(', ')]
        ].forEach(([key, value]) => value && md.push(`| ${key} | ${value} |\n`));
        md.push('\n---\n## 📚 Chapters\n');

        const selectedIds = getSelectedChapterIds();
        const selectedParts = parts.filter(p => selectedIds.includes(String(p.id)) && (fetchedChapters[String(p.id)] || rewrittenChapters[String(p.id)])).sort((a, b) => a.index - b.index);

        if (selectedParts.length === 0) {
          md.push('_No chapters selected or content not fetched._\n');
        } else {
          selectedParts.forEach(part => {
            const partId = String(part.id);
            const isRewritten = !!rewrittenChapters[partId];
            const chapterTitle = `${part.title || `Chapter ${part.index}`}${isRewritten ? ' (AI Enhanced)' : ''}`;
            const rawHtml = rewrittenChapters[partId] || fetchedChapters[partId]; // Prefer rewritten if available
            md.push(`### [${chapterTitle}](${part.url || '#'})`);
            md.push(`\n***Part Number:** ${part.index} | **Published:** ${part.createDate || 'N/A'} | **Chapter ID:** ${partId}*\n\n`);
            if (rawHtml) {
              try { md.push(turndownService.turndown(rawHtml)); }
              catch (e) { md.push('\n\n_[Error converting content to Markdown.]_\n\n'); }
            } else { md.push('_Content not available._'); }
            md.push('\n\n---\n\n');
          });
        }
        return md.join('').trim();
      }

      function getSelectedChapterIds() {
        return Array.from(DOMElements.chapterList.querySelectorAll('.chapter-item-checkbox:checked')).map(cb => cb.dataset.partId).filter(Boolean);
      }

      function parseChapterRange(rangeString, maxIndex) {
        const indices = new Set();
        if (!rangeString || maxIndex <= 0) return [];
        for (const part of rangeString.split(',')) {
          const trimmed = part.trim();
          if (!trimmed) continue;
          if (trimmed.includes('-')) {
            const [start, end] = trimmed.split('-').map(s => parseInt(s, 10));
            if (isNaN(start) || isNaN(end) || start < 1 || end > maxIndex || start > end) throw new Error(`Invalid range: "${trimmed}"`);
            for (let i = start; i <= end; i++) indices.add(i);
          } else {
            const index = parseInt(trimmed, 10);
            if (isNaN(index) || index < 1 || index > maxIndex) throw new Error(`Invalid chapter number: "${trimmed}"`);
            indices.add(index);
          }
        }
        return Array.from(indices).sort((a, b) => a - b);
      }

      function updatePromptSelection(newKey) {
          if (!CONFIG.PREDEFINED_PROMPTS[newKey]) return;
          currentPromptKey = newKey;
          const promptName = CONFIG.PREDEFINED_PROMPTS[newKey].name;
          DOMElements.rewriteButtonText.textContent = `✨ Rewrite (${promptName})`;
          DOMElements.promptDropdown.querySelectorAll('.prompt-item').forEach(item => {
              item.classList.toggle('active', item.dataset.promptKey === newKey);
          });
          DOMElements.promptDropdown.classList.add('hidden');
          DOMElements.promptDropdownToggle.setAttribute('aria-expanded', 'false');
          log.info(`Active AI prompt set to: ${promptName}`);
      }

      function setUIState(state) {
        log.info(`Setting UI state to: ${state}`);
        const anyLoading = state === 'loadingMeta' || state === 'loadingChapters' || state === 'rewritingChapters';
        const isChaptersLoaded = state === 'chaptersLoaded';
        const hasFetchedChapters = Object.keys(fetchedChapters).length > 0;
        const hasChaptersToList = storyData?.parts?.length > 0;

        DOMElements.storyUrlInput.disabled = anyLoading;
        DOMElements.geminiApiKeyInput.disabled = anyLoading;

        DOMElements.fetchMetadataButton.disabled = anyLoading;
        DOMElements.fetchMetadataButton.classList.toggle('loading', state === 'loadingMeta');
        DOMElements.fetchMetadataButton.querySelector('span:not(.spinner)').textContent = state === 'loadingMeta' ? 'Fetching...' : 'Fetch Story Info';

        DOMElements.fetchChaptersButton.disabled = !(state === 'metaLoaded' || isChaptersLoaded) || anyLoading || !hasChaptersToList;
        DOMElements.fetchChaptersButton.classList.toggle('loading', state === 'loadingChapters');
        DOMElements.fetchChaptersButton.querySelector('span:not(.spinner)').textContent = state === 'loadingChapters' ? 'Fetching...' : 'Fetch Selected Chapters';

        DOMElements.rewriteChaptersButton.disabled = !isChaptersLoaded || anyLoading;
        DOMElements.promptDropdownToggle.disabled = !isChaptersLoaded || anyLoading;
        DOMElements.rewriteChaptersButton.classList.toggle('loading', state === 'rewritingChapters');
        if (state === 'rewritingChapters') { DOMElements.rewriteButtonText.textContent = 'Rewriting...'; }
        else { updatePromptSelection(currentPromptKey); }

        DOMElements.copyMarkdownButton.disabled = !hasFetchedChapters || anyLoading;
        DOMElements.copyMarkdownButton.classList.remove('loading');

        DOMElements.selectAllCheckbox.disabled = !(state === 'metaLoaded' || isChaptersLoaded) || anyLoading || !hasChaptersToList;
        DOMElements.chapterRangeInput.disabled = !(state === 'metaLoaded' || isChaptersLoaded) || anyLoading || !hasChaptersToList;
        DOMElements.applyRangeButton.disabled = !(state === 'metaLoaded' || isChaptersLoaded) || anyLoading || !hasChaptersToList;
        DOMElements.chapterList.querySelectorAll('.chapter-item-checkbox').forEach(cb => (cb.disabled = anyLoading));
      }

      // ==== Event Listeners ====
      DOMElements.fetchMetadataButton.addEventListener('click', async () => {
        const url = DOMElements.storyUrlInput.value.trim();
        if (!url || !url.includes('wattpad.com/story/')) {
          showStatus('❌ Please enter a valid Wattpad Story URL.', 'error', 5000);
          return;
        }
        storyData = null; fetchedChapters = {}; rewrittenChapters = {};
        DOMElements.metadataDisplay.innerHTML = '';
        DOMElements.storyContentDisplay.innerHTML = '';
        DOMElements.chapterRangeInput.value = '';
        DOMElements.chapterList.innerHTML = '<li style="text-align: center; color: var(--subtle-text-color); padding: 20px;">Fetching...</li>';
        clearStatus();
        setUIState('loadingMeta');
        try {
          const html = await fetchWithTimeout(url, 'Story Page HTML');
          storyData = parseStoryPage(html, url);
          if (!storyData || !storyData.id) throw new Error("Failed to parse essential story data.");
          displayMetadata(storyData);
          displayChapterSelection(storyData.parts);
          showStatus(`✅ Loaded "${storyData.title}".`, 'success', 6000);
          setUIState('metaLoaded');
        } catch (error) {
          showStatus(`⚠️ Error: ${error.message}`, 'error');
          DOMElements.metadataSection.classList.add('hidden');
          DOMElements.chaptersSection.classList.add('hidden');
          DOMElements.contentSection.classList.add('hidden');
          setUIState('idle');
        }
      });

      DOMElements.fetchChaptersButton.addEventListener('click', async () => {
        const selectedIds = getSelectedChapterIds();
        if (selectedIds.length === 0) {
          showStatus('ℹ️ Please select chapters to fetch.', 'info', 3000);
          return;
        }
        clearStatus();
        setUIState('loadingChapters');
        DOMElements.storyContentDisplay.innerHTML = `<p style="text-align: center; color: var(--subtle-text-color);">Fetching ${selectedIds.length} chapter(s)...</p>`;
        fetchedChapters = {}; rewrittenChapters = {}; // Clear previous fetches/rewrites
        let successCount = 0;
        const total = selectedIds.length;
        const partsToFetch = storyData.parts.filter(p => selectedIds.includes(String(p.id))).sort((a, b) => a.index - b.index);
        DOMElements.storyContentDisplay.innerHTML = ''; // Clear content display before adding new
        for (let i = 0; i < partsToFetch.length; i++) {
          const part = partsToFetch[i];
          showStatus(`⏳ Fetching ${i + 1}/${total}: "${part.title.substring(0, 25)}..."`, 'info');
          try {
            const htmlContent = await fetchWithTimeout(`${CONFIG.API_BASE}${part.id}`, `Chapter ${part.id}`);
            fetchedChapters[part.id] = htmlContent;
            displayChapterContent(part.id, part.index, part.title, part.createDate, htmlContent);
            successCount++;
          } catch (error) {
            displayChapterContent(part.id, part.index, part.title, part.createDate, '', true, error.message);
          }
        }
        if (successCount < total) {
          showStatus(`⚠️ Completed with errors. Fetched ${successCount}/${total}.`, 'error');
        } else {
          showStatus(`✅ Successfully fetched ${successCount} chapter(s).`, 'success', 5000);
        }
        setUIState('chaptersLoaded');
      });

      // MODIFIED: Rewrite Chapters button event listener for sequential processing.
      DOMElements.rewriteChaptersButton.addEventListener('click', async () => {
          log.info(`Rewrite button clicked with prompt: ${currentPromptKey}`);
          const apiKey = DOMElements.geminiApiKeyInput.value.trim();
          const promptConfig = CONFIG.PREDEFINED_PROMPTS[currentPromptKey];

          if (!apiKey) { showStatus('❌ Please enter your Google Gemini API key.', 'error', 5000); return; }
          if (!promptConfig) { showStatus('❌ No valid AI prompt selected.', 'error', 5000); return; }

          const prompt = promptConfig.prompt;
          const selectedPartIds = getSelectedChapterIds();

          // Filter to only include chapters that are selected AND have been successfully fetched
          const chaptersToRewrite = storyData.parts
              .filter(p => selectedPartIds.includes(String(p.id)) && fetchedChapters[String(p.id)])
              .sort((a, b) => a.index - b.index);

          if (chaptersToRewrite.length === 0) {
              showStatus('ℹ️ No fetched chapters selected to rewrite. Please fetch chapters first.', 'info', 5000);
              return;
          }

          setUIState('rewritingChapters');
          clearStatus();
          rewrittenChapters = {}; // Clear previous rewritten content
          let successCount = 0;
          let errorCount = 0;
          const totalChapters = chaptersToRewrite.length;

          // Process chapters sequentially
          for (let i = 0; i < totalChapters; i++) {
              const part = chaptersToRewrite[i];
              const partId = String(part.id);
              const htmlContent = fetchedChapters[partId]; // Get the original fetched HTML content

              showStatus(`✨ Rewriting chapter ${i + 1}/${totalChapters}: "${part.title.substring(0, 25)}..."`, 'info');

              try {
                  const rewrittenHtml = await rewriteChapterWithAI(apiKey, prompt, htmlContent);
                  rewrittenChapters[partId] = rewrittenHtml;
                  // Display the rewritten content, marking it as AI Enhanced
                  displayChapterContent(part.id, part.index, part.title, part.createDate, rewrittenHtml, false, '', true);
                  successCount++;
              } catch (error) {
                  errorCount++;
                  log.error(`AI rewrite failed for chapter ${part.id}:`, error);
                  // Display an error message in the chapter content area
                  displayChapterContent(part.id, part.index, part.title, part.createDate, '', true, error.message, true);
              }
          }

          if (errorCount > 0) {
              showStatus(`⚠️ Rewrite complete. ${successCount} succeeded, ${errorCount} failed.`, 'error');
          } else {
              showStatus(`✅ Successfully rewrote ${successCount} chapter(s) with AI.`, 'success', 5000);
          }
          setUIState('chaptersLoaded');
      });

      DOMElements.copyMarkdownButton.addEventListener('click', async () => {
        try {
          const markdown = buildMarkdown();
          if (!markdown) {
            showStatus('ℹ️ No content to copy.', 'info', 3000);
            return;
          }
          await navigator.clipboard.writeText(markdown);
          showStatus('✅ Markdown copied!', 'success', 2500);
        } catch (err) {
          showStatus(`❌ Auto-copy failed: ${err.message}.`, 'error');
        }
      });

      DOMElements.applyRangeButton.addEventListener('click', () => {
        try {
          clearStatus();
          const indicesToSelect = parseChapterRange(DOMElements.chapterRangeInput.value, storyData?.parts?.length ?? 0);
          DOMElements.chapterList.querySelectorAll('.chapter-item-checkbox').forEach(cb => (cb.checked = false));
          indicesToSelect.forEach(index => {
            const cb = DOMElements.chapterList.querySelector(`.chapter-item-checkbox[data-index="${index}"]`);
            if (cb) cb.checked = true;
          });
          showStatus(`✅ Applied range. Selected ${indicesToSelect.length} chapters.`, 'success', 3000);
          updateSelectAllState();
        } catch (error) {
          showStatus(`❌ Range Error: ${error.message}`, 'error', 5000);
        }
      });

      function updateSelectAllState() {
        const all = DOMElements.chapterList.querySelectorAll('.chapter-item-checkbox');
        const checkedCount = DOMElements.chapterList.querySelectorAll('.chapter-item-checkbox:checked').length;
        if (all.length === 0 || checkedCount === 0) {
          DOMElements.selectAllCheckbox.checked = false; DOMElements.selectAllCheckbox.indeterminate = false;
        } else if (checkedCount === all.length) {
          DOMElements.selectAllCheckbox.checked = true; DOMElements.selectAllCheckbox.indeterminate = false;
        } else {
          DOMElements.selectAllCheckbox.checked = false; DOMElements.selectAllCheckbox.indeterminate = true;
        }
      }
      DOMElements.chapterList.addEventListener('change', (e) => { if (e.target.matches('.chapter-item-checkbox')) updateSelectAllState(); });
      DOMElements.selectAllCheckbox.addEventListener('change', (e) => {
        DOMElements.chapterList.querySelectorAll('.chapter-item-checkbox').forEach(cb => (cb.checked = e.target.checked));
        DOMElements.selectAllCheckbox.indeterminate = false;
      });

      DOMElements.promptDropdownToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const isHidden = DOMElements.promptDropdown.classList.toggle('hidden');
          DOMElements.promptDropdownToggle.setAttribute('aria-expanded', String(!isHidden));
      });
      DOMElements.promptDropdown.addEventListener('click', (e) => {
          const target = e.target.closest('.prompt-item');
          if (target && target.dataset.promptKey) updatePromptSelection(target.dataset.promptKey);
      });
      document.addEventListener('click', (e) => {
          if (!e.target.closest('.split-button-container') && !DOMElements.promptDropdown.classList.contains('hidden')) {
              DOMElements.promptDropdown.classList.add('hidden');
              DOMElements.promptDropdownToggle.setAttribute('aria-expanded', 'false');
          }
      });

      function applyTheme(theme) {
        DOMElements.htmlElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        DOMElements.themeToggleButton.textContent = theme === 'dark' ? '☀️' : '🌙';
      }
      DOMElements.themeToggleButton.addEventListener('click', () => {
        const newTheme = DOMElements.htmlElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        applyTheme(newTheme);
      });

      // ==== Initialization ====
      function initialize() {
        log.info('--- Wattpad Story Fetcher Initializing ---');
        const savedTheme = localStorage.getItem('theme');
        applyTheme(savedTheme === 'light' ? 'light' : 'dark');

        const dropdown = DOMElements.promptDropdown;
        dropdown.innerHTML = '';
        for (const [key, { name }] of Object.entries(CONFIG.PREDEFINED_PROMPTS)) {
            const li = document.createElement('li');
            li.className = 'prompt-item';
            li.textContent = name;
            li.dataset.promptKey = key;
            li.setAttribute('role', 'menuitem');
            dropdown.appendChild(li);
        }
        updatePromptSelection(CONFIG.DEFAULT_PROMPT_KEY);

        if (typeof TurndownService !== 'undefined') {
          turndownService = new TurndownService(CONFIG.TURNDOWN);
        } else {
          showStatus('❌ Markdown converter failed to load.', 'error');
          DOMElements.copyMarkdownButton.disabled = true;
        }
        setUIState('idle');
        clearStatus();
        log.info('--- Initialization Complete ---');
      }

      document.addEventListener('DOMContentLoaded', initialize);
    </script>
  </body>
</html>

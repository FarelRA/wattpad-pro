<!DOCTYPE html>
<html lang="en" x-data="themeHandler()" :class="{ 'dark': isDark }">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wattpad Pro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@latest/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown@latest/dist/turndown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: {
                    sans: ['Inter', 'sans-serif'],
                    serif: ['Merriweather', 'serif'],
                },
                extend: {
                    colors: {
                        primary: { 50: '#fff1e8', 100: '#ffd9c2', 500: '#ff6600', 600: '#e65c00', 700: '#cc5200' },
                        secondary: { 50: '#ecf5ff', 100: '#d9ecff', 500: '#409eff', 600: '#2f89eb', 700: '#2677d1' },
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --text-color: #2c3e50;
            --secondary-bg-color: #ffffff;
            --input-bg-color: #ffffff;
            --input-border-color: #dcdfe6;
            --heading-color: #34495e;
            --subtle-text-color: #8492a6;
            --separator-color: #e4e7ed;
            --card-border: #e4e7ed;
            --card-bg: #ffffff;
            --success-bg: #f0f9eb;
            --success-text: #67c23a;
            --success-border: #e1f3d8;
            --error-bg: #fef0f0;
            --error-text: #f56c6c;
            --error-border: #fde2e2;
            --button-muted-bg: #f4f4f5;
            --button-muted-text: #909399;
            --button-muted-border: #e9e9eb;
            --info-bg: #ffedd5;
            --info-text: #c2410c;
            --info-border: #fdba74;
            --tag-bg: #fff7ed;
            --tag-text: #ea580c;
            --tag-border: #fed7aa;
        }

        .dark {
            --bg-color: #1c1e21;
            --text-color: #e4e6eb;
            --secondary-bg-color: #242526;
            --input-bg-color: #3a3b3c;
            --input-border-color: #4b4d4f;
            --heading-color: #ccd0d5;
            --subtle-text-color: #a0a3a8;
            --separator-color: #3e4042;
            --card-border: #3e4042;
            --card-bg: #2d2e2f;
            --success-bg: #2a4a2a;
            --success-text: #aaffee;
            --success-border: #4a8a4a;
            --error-bg: #3a2a2a;
            --error-text: #f2aaaa;
            --error-border: #5a3a3a;
            --button-muted-bg: #3a3a3a;
            --button-muted-text: #b0b3b8;
            --button-muted-border: #555;
            --info-bg: rgba(255, 102, 0, 0.15);
            --info-text: #fdba74;
            --info-border: rgba(255, 166, 77, 0.28);
            --tag-bg: rgba(255, 102, 0, 0.10);
            --tag-text: #ffcf99;
            --tag-border: rgba(255, 166, 77, 0.2);
        }

        /* Custom scrollbar for better aesthetics */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; }
        .chapter-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 0.375rem;
            border: 1.5px solid var(--input-border-color);
            background: var(--secondary-bg-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }
        .chapter-checkbox:checked {
            background: #ff6600;
            border-color: #ff6600;
            box-shadow: 0 0 0 3px color-mix(in srgb, #ff6600 18%, transparent);
        }
        .chapter-checkbox:checked::after {
            content: '';
            width: 0.3rem;
            height: 0.55rem;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(45deg) translate(-1px, -1px);
        }
        .chapter-checkbox:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px color-mix(in srgb, #ff6600 20%, transparent);
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-[var(--bg-color)] text-[var(--text-color)] min-h-screen transition-colors duration-200 antialiased font-sans p-4 sm:p-6 lg:p-8 relative" x-data="wattpadApp()">
    
    <div x-show="toast.visible" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-2" class="fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-xl flex items-center gap-3 border" :class="toast.type === 'error' ? 'bg-[var(--error-bg)] text-[var(--error-text)] border-[var(--error-border)]' : 'bg-[var(--success-bg)] text-[var(--success-text)] border-[var(--success-border)]'" x-cloak>
        <i :data-lucide="toast.type === 'error' ? 'alert-circle' : 'check-circle'" class="w-5 h-5"></i>
        <span x-text="toast.message" class="font-medium text-sm"></span>
    </div>

    <div class="max-w-5xl mx-auto space-y-6">
        
        <header class="flex flex-wrap justify-between items-center gap-4 bg-[var(--secondary-bg-color)] rounded-2xl shadow-sm border border-[var(--card-border)] p-5 sm:p-6">
            <div class="flex items-center gap-3 min-w-0">
                <div class="bg-primary-100/90 dark:bg-primary-500/15 p-2 rounded-lg text-primary-600 dark:text-primary-500">
                    <i data-lucide="book-open-check"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-[var(--heading-color)]">Wattpad <span class="text-primary-500">Pro</span></h1>
                </div>
            </div>
            <button @click="toggleTheme()" class="p-2.5 rounded-xl bg-[var(--input-bg-color)] text-[var(--text-color)] hover:bg-black/5 dark:hover:bg-white/10 transition-colors border border-[var(--card-border)]">
                <i data-lucide="sun" x-show="isDark" class="w-5 h-5"></i>
                <i data-lucide="moon" x-show="!isDark" class="w-5 h-5"></i>
            </button>
        </header>

        <section class="bg-[var(--secondary-bg-color)] rounded-2xl shadow-sm border border-[var(--card-border)] p-6 space-y-6">
            <div>
                <label class="block text-sm font-semibold text-[var(--subtle-text-color)] mb-2 flex items-center gap-2">
                    <i data-lucide="link" class="w-4 h-4 text-primary-600"></i> Wattpad URL
                </label>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" x-model="url" :disabled="isLoadingAny" @keydown.enter="fetchMetadata()" placeholder="https://www.wattpad.com/story/..." class="block w-full px-4 py-3 bg-[var(--input-bg-color)] border border-[var(--input-border-color)] rounded-xl text-[var(--text-color)] focus:ring-2 focus:ring-primary-500 focus:border-primary-500 disabled:opacity-50 transition-all" />
                    <button @click="fetchMetadata()" :disabled="isLoadingAny || !url" class="bg-primary-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-primary-700 disabled:opacity-50 flex items-center justify-center gap-2 transition-all whitespace-nowrap shadow-md hover:shadow-lg sm:self-auto">
                        <i data-lucide="search" class="w-4 h-4" x-show="uiState !== 'loadingMeta'"></i>
                        <i data-lucide="loader-2" class="w-4 h-4 animate-spin" x-show="uiState === 'loadingMeta'"></i>
                        <span x-text="uiState === 'loadingMeta' ? 'Fetching...' : 'Analyze'"></span>
                    </button>
                </div>
            </div>

            <div class="border-t border-[var(--separator-color)] pt-4">
                <div class="flex items-center gap-2 mb-3 cursor-pointer select-none" @click="showAi = !showAi">
                    <i data-lucide="bot" class="w-4 h-4 text-primary-600"></i>
                    <span class="text-xs font-bold uppercase tracking-wider text-[var(--subtle-text-color)] hover:text-primary-600 transition-colors">AI & API Configuration</span>
                    <i data-lucide="chevron-down" class="w-3 h-3 text-[var(--subtle-text-color)] transform transition-transform" :class="showAi ? 'rotate-180' : ''"></i>
                </div>
                
                <div x-show="showAi" x-collapse class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-[var(--bg-color)] p-4 rounded-xl border border-[var(--card-border)]">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-medium text-[var(--subtle-text-color)] mb-1">Base URL (e.g., LocalAI/Ollama)</label>
                        <input type="text" x-model="aiConfig.baseUrl" @input="saveConfig" placeholder="https://api.openai.com/v1" class="block w-full px-3 py-2 text-sm bg-[var(--secondary-bg-color)] border border-[var(--input-border-color)] rounded-lg focus:ring-1 focus:ring-primary-500" />
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[var(--subtle-text-color)] mb-1">Model Name</label>
                        <input type="text" x-model="aiConfig.model" @input="saveConfig" placeholder="gpt-4o-mini" class="block w-full px-3 py-2 text-sm bg-[var(--secondary-bg-color)] border border-[var(--input-border-color)] rounded-lg focus:ring-1 focus:ring-primary-500" />
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[var(--subtle-text-color)] mb-1">API Key</label>
                        <input type="password" x-model="aiConfig.apiKey" @input="saveConfig" placeholder="sk-..." class="block w-full px-3 py-2 text-sm bg-[var(--secondary-bg-color)] border border-[var(--input-border-color)] rounded-lg focus:ring-1 focus:ring-primary-500" />
                    </div>
                </div>
            </div>
        </section>

        <section x-show="storyData !== null" x-transition class="space-y-6" style="display: none;">
            
            <div class="bg-[var(--secondary-bg-color)] rounded-2xl shadow-sm border border-[var(--card-border)] p-6 md:p-8">
                <template x-if="storyData">
                    <div class="flex flex-col md:flex-row gap-8">
                        <div class="flex-shrink-0 mx-auto md:mx-0">
                            <a :href="storyData.story.url" target="_blank" rel="noopener noreferrer" class="block">
                                <img :src="storyData.story.cover" class="w-48 aspect-[2/3] rounded-lg shadow-lg object-cover ring-1 ring-black/10 dark:ring-white/10 hover:opacity-95 transition-opacity">
                            </a>
                        </div>
                        
                        <div class="flex-1 space-y-4 text-left">
                            <h2 class="text-3xl md:text-4xl font-black font-serif tracking-tight">
                                <a :href="storyData.story.url" target="_blank" rel="noopener noreferrer" class="text-[var(--heading-color)] hover:text-primary-500 transition-colors" x-text="storyData.story.title"></a>
                            </h2>
                             
                            <div class="flex flex-wrap items-center justify-start gap-3">
                                <img :src="storyData.author.avatar" class="w-8 h-8 rounded-full border border-[var(--card-border)]">
                                <p class="font-bold text-[var(--heading-color)] shrink-0" x-text="storyData.author.name"></p>
                                <div class="basis-full h-0 sm:hidden"></div>
                                <div class="flex flex-wrap items-center justify-start gap-2 min-w-0">
                                    <span x-show="storyData.story.completed" class="px-2 py-0.5 text-[10px] font-bold uppercase bg-[var(--success-bg)] text-[var(--success-text)] border border-[var(--success-border)] rounded">Completed</span>
                                    <span x-show="!storyData.story.completed" class="px-2 py-0.5 text-[10px] font-bold uppercase bg-[var(--info-bg)] text-[var(--info-text)] border border-[var(--info-border)] rounded">Ongoing</span>
                                    <span x-show="storyData.moderation.mature" class="px-2 py-0.5 text-[10px] font-bold uppercase bg-[var(--error-bg)] text-[var(--error-text)] border border-[var(--error-border)] rounded">Mature</span>
                                    <span class="px-2 py-0.5 text-[10px] font-bold uppercase bg-[var(--bg-color)] text-[var(--subtle-text-color)] rounded border border-[var(--card-border)]" x-text="storyData.story.language?.name || 'Unknown'"></span>
                                </div>
                            </div>

                            <p class="text-sm text-[var(--subtle-text-color)] leading-relaxed font-serif whitespace-pre-line break-words" x-text="storyData.story.description"></p>
                        </div>
                    </div>
                </template>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="p-4 rounded-xl bg-[var(--secondary-bg-color)] border border-[var(--card-border)] shadow-sm flex flex-col items-center justify-center text-center">
                    <p class="text-[10px] uppercase font-bold text-[var(--subtle-text-color)] tracking-wider mb-1">Reads</p>
                    <p class="text-xl font-black text-[var(--heading-color)]" x-text="formatNumber(storyData.stats.reads)"></p>
                </div>
                <div class="p-4 rounded-xl bg-[var(--secondary-bg-color)] border border-[var(--card-border)] shadow-sm flex flex-col items-center justify-center text-center">
                    <p class="text-[10px] uppercase font-bold text-[var(--subtle-text-color)] tracking-wider mb-1">Votes</p>
                    <p class="text-xl font-black text-[var(--heading-color)]" x-text="formatNumber(storyData.stats.votes)"></p>
                </div>
                <div class="p-4 rounded-xl bg-[var(--secondary-bg-color)] border border-[var(--card-border)] shadow-sm flex flex-col items-center justify-center text-center">
                    <p class="text-[10px] uppercase font-bold text-[var(--subtle-text-color)] tracking-wider mb-1">Comments</p>
                    <p class="text-xl font-black text-[var(--heading-color)]" x-text="formatNumber(storyData.stats.comments)"></p>
                </div>
                <div class="p-4 rounded-xl bg-[var(--secondary-bg-color)] border border-[var(--card-border)] shadow-sm flex flex-col items-center justify-center text-center">
                    <p class="text-[10px] uppercase font-bold text-[var(--subtle-text-color)] tracking-wider mb-1">Words (Est)</p>
                    <p class="text-xl font-black text-[var(--heading-color)]" x-text="formatNumber(storyData.stats.words)"></p>
                </div>
            </div>

            <div class="bg-[var(--secondary-bg-color)] rounded-2xl shadow-sm border border-[var(--card-border)] p-5">
                <div class="flex flex-wrap gap-2">
                    <template x-for="category in (storyData.story.categories || [])" :key="'category-' + category.id">
                        <span class="px-3 py-1 text-xs font-semibold rounded-full bg-[var(--info-bg)] text-[var(--info-text)] border border-[var(--info-border)]" x-text="category.name"></span>
                    </template>
                    <template x-for="tag in (storyData.story.storyTags || [])" :key="'tag-' + (tag.id || tag.name)">
                        <span class="px-3 py-1 text-xs font-semibold rounded-full bg-[var(--tag-bg)] text-[var(--tag-text)] border border-[var(--tag-border)]" x-text="tag.name"></span>
                    </template>
                    <span x-show="!(storyData.story.categories?.length || storyData.story.storyTags?.length)" class="text-sm text-[var(--subtle-text-color)]">No categories or tags available</span>
                </div>
            </div>

            <div class="bg-[var(--secondary-bg-color)] rounded-2xl shadow-sm border border-[var(--card-border)] flex flex-col overflow-hidden max-h-[560px]">
                <div class="overflow-y-auto p-3 bg-[var(--bg-color)] custom-scrollbar">
                    <ul class="space-y-2">
                        <template x-for="(part, index) in (storyData ? storyData.chapters : [])" :key="part.id">
                            <li class="flex items-center gap-4 p-4 rounded-xl border transition-colors cursor-pointer"
                                :class="selectedIds.includes(String(part.id))
                                    ? 'bg-[var(--secondary-bg-color)] border-primary-500 shadow-sm'
                                    : 'bg-[var(--card-bg)] border-[var(--card-border)] hover:bg-[var(--secondary-bg-color)]'"
                                @click="toggleId(String(part.id))">
                                <div class="relative flex items-center">
                                    <input type="checkbox" :value="String(part.id)" x-model="selectedIds" class="chapter-checkbox pointer-events-none">
                                </div>
                                <div class="flex-1 min-w-0">
                                    <a :href="part.url" target="_blank" rel="noopener noreferrer" class="font-semibold text-sm truncate text-primary-500 hover:underline block" x-text="part.title" @click.stop></a>
                                    <div class="text-xs text-[var(--subtle-text-color)] mt-1 flex flex-wrap items-center gap-x-2 gap-y-1">
                                        <span><span class="font-bold" x-text="'Part: ' + (index + 1)"></span></span>
                                        <span class="text-[var(--separator-color)]">|</span>
                                        <span>ID: <span x-text="part.id"></span></span>
                                        <span class="text-[var(--separator-color)]">|</span>
                                        <span>Words: <span x-text="formatNumber(part.length)"></span></span>
                                        <span class="text-[var(--separator-color)]">|</span>
                                        <span>Date: <span x-text="part.formattedCreatedAt || part.createdAt || 'Unknown'"></span></span>
                                        <template x-if="part.isNew">
                                            <>
                                                <span class="text-[var(--separator-color)]">|</span>
                                                <span class="text-primary-600">New</span>
                                            </>
                                        </template>
                                        <template x-if="part.draft">
                                            <>
                                                <span class="text-[var(--separator-color)]">|</span>
                                                <span class="text-[var(--error-text)]">Draft</span>
                                            </>
                                        </template>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div>
                <div class="p-4 bg-[var(--secondary-bg-color)]">
                    <div class="flex flex-col lg:flex-row lg:items-center gap-3 rounded-xl bg-[var(--bg-color)] border border-[var(--card-border)] px-4 py-3">
                        <div class="flex flex-wrap items-center gap-3">
                            <span class="text-sm font-medium text-[var(--subtle-text-color)]">
                                <span class="text-[var(--heading-color)] font-semibold" x-text="selectedIds.length"></span>
                                selected
                            </span>
                            <div class="h-5 w-px bg-[var(--separator-color)] hidden sm:block"></div>
                            <div class="flex flex-wrap items-center gap-2">
                                <button @click="toggleSelectAll(true)" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-[var(--button-muted-bg)] text-[var(--button-muted-text)] border border-[var(--button-muted-border)] hover:brightness-95 transition">Select All</button>
                                <button @click="toggleSelectAll(false)" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-[var(--button-muted-bg)] text-[var(--button-muted-text)] border border-[var(--button-muted-border)] hover:brightness-95 transition">Clear</button>
                            </div>
                        </div>
                        <div class="flex-1 lg:max-w-sm lg:ml-auto flex flex-col sm:flex-row gap-2 w-full">
                            <input type="text" x-model="chapterRangeInput" @keydown.enter.prevent="applyChapterRange()" placeholder="1-5, 8, 11-13" class="flex-1 px-3 py-2 text-sm bg-[var(--secondary-bg-color)] border border-[var(--input-border-color)] rounded-lg text-[var(--text-color)] focus:ring-1 focus:ring-primary-500 focus:border-primary-500" />
                            <button @click="applyChapterRange()" class="px-3 py-2 text-xs font-semibold rounded-lg bg-[var(--button-muted-bg)] text-[var(--button-muted-text)] border border-[var(--button-muted-border)] hover:brightness-95 transition whitespace-nowrap">Apply Range</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sticky bottom-4 sm:bottom-6 z-30">
                <div x-show="statusMessage" x-transition class="bg-[var(--info-bg)] text-[var(--info-text)] border border-[var(--info-border)] text-xs font-bold py-1.5 px-4 rounded-t-xl mx-2 sm:mx-4 w-fit max-w-[calc(100%-1rem)] sm:max-w-none shadow-lg flex items-center gap-2">
                    <i data-lucide="loader" class="w-3 h-3 animate-spin"></i>
                    <span x-text="statusMessage"></span>
                </div>

                <div class="bg-[var(--secondary-bg-color)] rounded-2xl shadow-xl border border-[var(--card-border)] p-3 sm:p-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    
                    <div class="flex flex-col sm:flex-row sm:flex-wrap items-stretch sm:items-center gap-3 w-full md:w-auto md:flex-1">
                        <button @click="fetchChapters()" :disabled="isLoadingAny || !selectedIds.length" class="w-full sm:w-auto flex-1 md:flex-none bg-[var(--bg-color)] hover:bg-black/5 dark:hover:bg-white/10 text-[var(--heading-color)] px-5 py-2.5 rounded-xl font-bold disabled:opacity-50 transition-all flex items-center justify-center gap-2 border border-[var(--card-border)]">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            Fetch
                        </button>

                        <div class="h-8 w-px bg-[var(--separator-color)] mx-1 hidden md:block"></div>

                        <div class="w-full sm:w-auto flex flex-col lg:flex-row gap-2 lg:gap-0 lg:rounded-xl shadow-sm">
                            <div class="relative flex-1 sm:flex-none" @keydown.escape.window="showPromptMenu = false">
                                <button @click="showPromptMenu = !showPromptMenu" type="button" class="w-full sm:min-w-[190px] h-[42px] bg-[var(--bg-color)] border border-[var(--input-border-color)] lg:border-y lg:border-l lg:border-r-0 text-[var(--text-color)] text-sm rounded-xl lg:rounded-l-xl lg:rounded-r-none px-3 py-2.5 focus:ring-primary-500 focus:border-primary-500 outline-none flex items-center justify-between gap-3">
                                    <span class="truncate text-left" x-text="CONFIG.PROMPTS[selectedPromptKey]?.label || 'Select prompt'"></span>
                                    <i data-lucide="chevrons-up-down" class="w-4 h-4 shrink-0 text-[var(--subtle-text-color)]"></i>
                                </button>
                                <div x-show="showPromptMenu" x-transition @click.outside="showPromptMenu = false" class="absolute bottom-full left-0 mb-2 w-full min-w-0 sm:min-w-[220px] rounded-xl border border-[var(--card-border)] bg-[var(--secondary-bg-color)] shadow-xl overflow-hidden z-40" style="display: none;">
                                    <div class="max-h-64 overflow-y-auto custom-scrollbar p-2">
                                        <template x-for="(prompt, key) in CONFIG.PROMPTS" :key="key">
                                            <button type="button" @click="selectedPromptKey = key; showPromptMenu = false" class="w-full text-left px-3 py-2.5 rounded-lg text-sm transition flex items-center justify-between gap-3"
                                                :class="selectedPromptKey === key ? 'bg-primary-100/80 dark:bg-primary-500/15 text-primary-700 dark:text-primary-400' : 'text-[var(--text-color)] hover:bg-[var(--bg-color)]'">
                                                <span class="truncate" x-text="prompt.label"></span>

    <script>
        const CONFIG = {
            CORS_PROXY: 'https://flare.farel.is-a.dev/conduit/?url=',
            API_WATT: 'https://www.wattpad.com/apiv2/storytext?id=',
            PROMPTS: {

                  text: 'Rewrite the following chapter, provided as HTML content, to be more descriptive and engaging. Enhance the sensory details (sight, sound, smell, touch, taste) and improve the pacing. Make the characters\' emotions more palpable. The output must be valid HTML, preserving the original structure and tags, only modifying the text content. Output only the modified HTML.'
                },
                'summarize': {

                },
                'translate': {

                  placeholder: {

                    options: [

                        { value: 'german', label: 'German' },
                        { value: 'japanese', label: 'Japanese' },
                        { value: 'nigerian-pidgin', label: 'Nigerian Pidgin' },
                        { value: 'marathi', label: 'Marathi' },
                        { value: 'telugu', label: 'Telugu' },
                        { value: 'turkish', label: 'Turkish' },
                        { value: 'tamil', label: 'Tamil' },
                        { value: 'yue-chinese', label: 'Yue Chinese (Cantonese)' },
                        { value: 'wu-chinese', label: 'Wu Chinese' },
                        { value: 'korean', label: 'Korean' },
                        { value: 'vietnamese', label: 'Vietnamese' },
                        { value: 'hausa', label: 'Hausa' },

                        { value: 'javanese', label: 'Javanese' },

                        { value: 'egyptian-arabic', label: 'Egyptian Arabic' },
                        { value: 'gujarati', label: 'Gujarati' },
                        { value: 'iranian-persian', label: 'Iranian Persian' },
                        { value: 'bhojpuri', label: 'Bhojpuri' },
                        { value: 'southern-min', label: 'Southern Min' },
                        { value: 'min-nan-chinese', label: 'Min Nan Chinese' },
                        { value: 'hakka-chinese', label: 'Hakka Chinese' },
                        { value: 'jin-chinese', label: 'Jin Chinese' },
                        { value: 'filipino', label: 'Filipino' },
                        { value: 'polish', label: 'Polish' },
                        { value: 'pashto', label: 'Pashto' },
                        { value: 'kannada', label: 'Kannada' },
                        { value: 'malayalam', label: 'Malayalam' },
                        { value: 'sundanese', label: 'Sundanese' },
                        { value: 'romanian', label: 'Romanian' },
                        { value: 'ukrainian', label: 'Ukrainian' },
                        { value: 'yoruba', label: 'Yoruba' },
                        { value: 'maithili', label: 'Maithili' },
                        { value: 'burmese', label: 'Burmese' },
                        { value: 'odia', label: 'Odia' },
                        { value: 'assamese', label: 'Assamese' },
                        { value: 'sindhi', label: 'Sindhi' },
                        { value: 'algerian-arabic', label: 'Algerian Arabic' },
                        { value: 'saraiki', label: 'Saraiki' },
                        { value: 'amharic', label: 'Amharic' },
                        { value: 'moroccan-arabic', label: 'Moroccan Arabic' },
                        { value: 'tagalog', label: 'Tagalog' },
                        { value: 'dutch', label: 'Dutch' }
                    ]
                  }
                },
            }
        };

        const proxiedUrl = (url) => CONFIG.CORS_PROXY + encodeURIComponent(url);

        function wattpadApp() {
            return {
                url: '',
                aiConfig: {
                    baseUrl: 'https://api.openai.com/v1',
                    apiKey: '',
                    model: 'gpt-4o-mini'
                },
                showAi: false,
                uiState: 'idle',
                statusMessage: '', // The Notif State
                toast: { visible: false, message: '', type: 'success' },
                
                storyData: null,
                chapterRangeInput: '',
                selectedIds: [],
                chapterContent: {}, // { id: { html: string, isAi: bool } }
                selectedPromptKey: 'proofread',
                showPromptMenu: false,
                selectedPromptPlaceholderPreset: 'spanish',
                promptPlaceholderInput: '',
                showPlaceholderMenu: false,
                turndown: null,

                init() {
                    if (typeof TurndownService !== 'undefined') this.turndown = new TurndownService({ headingStyle: 'atx' });
                    
                    // Load Config
                    const saved = localStorage.getItem('wattpad_config');
                    if (saved) {
                        try {
                            this.aiConfig = { ...this.aiConfig, ...JSON.parse(saved) };
                        } catch(e) {}
                    }
                    this.refreshIcons();
                },

                saveConfig() {
                    localStorage.setItem('wattpad_config', JSON.stringify(this.aiConfig));
                },

                showToast(msg, type = 'success') {
                    this.toast.message = msg;
                    this.toast.type = type;
                    this.toast.visible = true;
                    setTimeout(() => this.toast.visible = false, 3000);
                },

                get isLoadingAny() { return ['loadingMeta', 'loadingChapters', 'rewritingChapters'].includes(this.uiState); },
                get hasFetchedChapters() { return Object.keys(this.chapterContent).length > 0; },
                get hasAnyContent() { return Object.keys(this.chapterContent).length > 0; },
                get currentPromptConfig() { return CONFIG.PROMPTS[this.selectedPromptKey] || null; },
                get currentPromptPlaceholder() { return this.currentPromptConfig?.placeholder || null; },
                get currentPromptPlaceholderOptions() { return this.currentPromptPlaceholder?.options || []; },

                refreshIcons() { this.$nextTick(() => lucide.createIcons()); },

                getPromptPlaceholderValue() {
                    const options = this.currentPromptPlaceholderOptions;
                    if (!options.length) return this.promptPlaceholderInput.trim();
                    const selected = options.find(option => option.value === this.selectedPromptPlaceholderPreset);
                    return selected?.label || options[0]?.label || '';
                },

                resolvePromptText() {
                    const promptText = this.currentPromptConfig?.text || '';
                    if (!promptText.includes('{{placeholder}}')) return promptText;
                    return promptText.replaceAll('{{placeholder}}', this.getPromptPlaceholderValue());
                },

                validatePromptPlaceholder() {
                    if (!this.currentPromptPlaceholder) return true;
                    if (this.getPromptPlaceholderValue()) return true;
                    this.showToast(`Please select or enter a ${this.currentPromptPlaceholder.label.toLowerCase()}`, 'error');
                    return false;
                },

                setChapterContent(id, patch) {
                    const existing = this.chapterContent[id] || {
                        html: '',
                        originalHtml: '',
                        isAi: false,
                        isStreaming: false,
                        statusLabel: '',
                        stage: 'idle',
                        streamBuffer: '',
                        flushScheduled: false
                    };
                    this.chapterContent[id] = { ...existing, ...patch };
                },

                queueChapterHtml(id, chunk) {
                    if (!chunk) return;
                    const entry = this.chapterContent[id];
                    if (!entry) return;

                    entry.streamBuffer = (entry.streamBuffer || '') + chunk;
                    if (entry.flushScheduled) return;

                    entry.flushScheduled = true;
                    requestAnimationFrame(() => {
                        const current = this.chapterContent[id];
                        if (!current) return;
                        current.html += current.streamBuffer || '';
                        current.streamBuffer = '';
                        current.flushScheduled = false;
                    });
                },

                flushChapterHtml(id) {
                    const entry = this.chapterContent[id];
                    if (!entry?.streamBuffer) return;
                    entry.html += entry.streamBuffer;
                    entry.streamBuffer = '';
                    entry.flushScheduled = false;
                },

                extractStreamContent(payload) {
                    const delta = payload?.choices?.[0]?.delta?.content;
                    if (typeof delta === 'string') return delta;
                    if (Array.isArray(delta)) {
                        return delta.map(item => typeof item === 'string' ? item : item?.text || '').join('');
                    }
                    return '';
                },

                async streamChatCompletion(id, sourceHtml) {
                    const res = await fetch(proxiedUrl(`${this.aiConfig.baseUrl}/chat/completions`), {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.aiConfig.apiKey}`
                        },
                        body: JSON.stringify({
                            model: this.aiConfig.model,
                            stream: true,
                            messages: [
                                { role: 'system', content: this.resolvePromptText() },
                                { role: 'user', content: sourceHtml }
                            ]
                        })
                    });

                    if (!res.ok) throw new Error(`API Error: ${res.status}`);

                    if (!res.body) {
                        const fallbackData = await res.json();
                        return fallbackData?.choices?.[0]?.message?.content || '';
                    }

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let streamedHtml = '';

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const events = buffer.split('\n\n');
                        buffer = events.pop() || '';

                        for (const event of events) {
                            const lines = event.split('\n').filter(line => line.startsWith('data: '));
                            for (const line of lines) {
                                const data = line.slice(6).trim();
                                if (!data || data === '[DONE]') continue;

                                let payload;
                                try {
                                    payload = JSON.parse(data);
                                } catch {
                                    continue;
                                }

                                const chunk = this.extractStreamContent(payload);
                                if (!chunk) continue;

                                streamedHtml += chunk;
                                this.setChapterContent(id, {
                                    isAi: true,
                                    isStreaming: true,
                                    stage: 'generating',
                                    statusLabel: 'Generating live...'
                                });
                                this.queueChapterHtml(id, chunk);
                            }
                        }
                    }

                    return streamedHtml;
                },

                formatNumber(num) {
                    if(!num) return '0';
                    if(num >= 1000000) return (num/1000000).toFixed(1) + 'M';
                    if(num >= 1000) return (num/1000).toFixed(1) + 'K';
                    return num.toLocaleString();
                },

                toggleId(id) {
                    if (this.selectedIds.includes(id)) {
                        this.selectedIds = this.selectedIds.filter(x => x !== id);
                    } else {
                        this.selectedIds.push(id);
                    }
                },
                toggleSelectAll(forceState) {
                    if (forceState) {
                        this.selectedIds = this.storyData.chapters.map(c => String(c.id));
                    } else {
                        this.selectedIds = [];
                    }
                },

                parseChapterRange(rangeString, maxIndex) {
                    const indices = new Set();
                    if (!rangeString || typeof rangeString !== 'string' || maxIndex <= 0) return [];

                    for (const part of rangeString.split(',')) {
                        const trimmed = part.trim();
                        if (!trimmed) continue;

                        if (trimmed.includes('-')) {
                            const [startRaw, endRaw] = trimmed.split('-').map(v => parseInt(v.trim(), 10));
                            if (Number.isNaN(startRaw) || Number.isNaN(endRaw)) continue;
                            const start = Math.max(1, Math.min(startRaw, endRaw));
                            const end = Math.min(maxIndex, Math.max(startRaw, endRaw));
                            for (let i = start; i <= end; i++) indices.add(i);
                        } else {
                            const value = parseInt(trimmed, 10);
                            if (!Number.isNaN(value) && value >= 1 && value <= maxIndex) indices.add(value);
                        }
                    }

                    return Array.from(indices).sort((a, b) => a - b);
                },

                applyChapterRange() {
                    if (!this.storyData?.chapters?.length) return;
                    const indices = this.parseChapterRange(this.chapterRangeInput, this.storyData.chapters.length);

                    if (!indices.length) {
                        this.showToast('Invalid chapter range', 'error');
                        return;
                    }

                    this.selectedIds = indices
                        .map(index => this.storyData.chapters[index - 1])
                        .filter(Boolean)
                        .map(chapter => String(chapter.id));
                },

                async fetchMetadata() {
                    if (!this.url.includes('wattpad.com/story/')) return this.showToast('Invalid Wattpad URL', 'error');
                    
                    this.uiState = 'loadingMeta';
                    this.statusMessage = 'Extracting story metadata...';
                    
                    try {
                        const res = await fetch(proxiedUrl(this.url));
                        const html = await res.text();
                        this.storyData = extractAllWattpadStoryData(html); // Using the previous parsing logic
                        this.chapterRangeInput = '';
                        this.selectedIds = [];
                        this.chapterContent = {};
                        this.showToast('Story loaded successfully');
                    } catch (e) {
                        this.showToast(e.message, 'error');
                    } finally {
                        this.uiState = 'idle';
                        this.statusMessage = '';
                        this.refreshIcons();
                    }
                },

                async fetchChapters() {
                    this.uiState = 'loadingChapters';
                    let count = 0;
                    
                    for (const id of this.selectedIds) {
                        count++;
                        this.statusMessage = `Fetching chapter ${count}/${this.selectedIds.length}...`;
                        try {
                            const res = await fetch(proxiedUrl(CONFIG.API_WATT + id));
                            const html = await res.text();
                            // Clean a bit of the wrappers if needed, but Wattpad API usually returns raw HTML
                            this.setChapterContent(id, {
                                html,
                                originalHtml: html,
                                isAi: false,
                                isStreaming: false,
                                statusLabel: '',
                                stage: 'idle',
                                streamBuffer: '',
                                flushScheduled: false
                            });
                        } catch (e) { console.error(e); }
                    }
                    this.uiState = 'idle';
                    this.statusMessage = '';
                    this.refreshIcons();
                    this.showToast(`Fetched ${count} chapters`);
                },

                async rewriteSingleChapter(id) {
                    if (!this.aiConfig.apiKey) return this.showToast('Please enter an API Key in settings', 'error');
                    if (!this.validatePromptPlaceholder()) return;
                    const entry = this.chapterContent[id];
                    if (!entry) return this.showToast('Fetch the chapter first', 'error');

                    const sourceHtml = entry.originalHtml || entry.html;
                    this.uiState = 'rewritingChapters';
                    this.statusMessage = 'Generating chapter 1/1...';

                    this.setChapterContent(id, {
                        html: '',
                        originalHtml: sourceHtml,
                        isAi: true,
                        isStreaming: false,
                        stage: 'processing',
                        statusLabel: 'Preparing AI stream (1/1)...',
                        streamBuffer: '',
                        flushScheduled: false
                    });
                    this.$nextTick(() => this.refreshIcons());

                    try {
                        const finalHtml = await this.streamChatCompletion(id, sourceHtml);
                        this.flushChapterHtml(id);
                        this.setChapterContent(id, {
                            html: finalHtml || this.chapterContent[id].html,
                            originalHtml: sourceHtml,
                            isAi: true,
                            isStreaming: false,
                            stage: 'done',
                            statusLabel: '',
                            streamBuffer: '',
                            flushScheduled: false
                        });
                        this.showToast('AI Enhancement complete');
                    } catch (e) {
                        console.error(e);
                        this.flushChapterHtml(id);
                        this.setChapterContent(id, {
                            originalHtml: sourceHtml,
                            isStreaming: false,
                            stage: 'error',
                            statusLabel: ''
                        });
                        this.showToast(`AI Error on Ch ${id}: ${e.message}`, 'error');
                    } finally {
                        this.uiState = 'idle';
                        this.statusMessage = '';
                        this.refreshIcons();
                    }
                },

                async rewriteChapters() {
                    if (!this.aiConfig.apiKey) return this.showToast('Please enter an API Key in settings', 'error');
                    if (!this.validatePromptPlaceholder()) return;
                    
                    this.uiState = 'rewritingChapters';
                    const ids = Object.keys(this.chapterContent);
                    const sourceById = Object.fromEntries(ids.map(id => [id, this.chapterContent[id].originalHtml || this.chapterContent[id].html]));
                    let count = 0;

                    ids.forEach((id, index) => {
                        this.setChapterContent(id, {
                            html: '',
                            originalHtml: sourceById[id],
                            isAi: true,
                            isStreaming: false,
                            stage: 'queued',
                            statusLabel: `Waiting for AI (${index + 1}/${ids.length})...`,
                            streamBuffer: '',
                            flushScheduled: false
                        });
                    });
                    this.refreshIcons();

                    for (const id of ids) {
                        count++;
                        this.statusMessage = `Generating chapter ${count}/${ids.length}...`;
                        try {
                            this.setChapterContent(id, {
                                isAi: true,
                                isStreaming: false,
                                stage: 'processing',
                                statusLabel: `Preparing AI stream (${count}/${ids.length})...`
                            });
                            this.$nextTick(() => this.refreshIcons());

                            const finalHtml = await this.streamChatCompletion(id, sourceById[id]);
                            this.flushChapterHtml(id);
                            this.setChapterContent(id, {
                                html: finalHtml || this.chapterContent[id].html,
                                originalHtml: sourceById[id],
                                isAi: true,
                                isStreaming: false,
                                stage: 'done',
                                statusLabel: '',
                                streamBuffer: '',
                                flushScheduled: false
                            });
                        } catch (e) { 
                            console.error(e);
                            this.flushChapterHtml(id);
                            this.setChapterContent(id, {
                                originalHtml: sourceById[id],
                                isStreaming: false,
                                stage: 'error',
                                statusLabel: ''
                            });
                            this.showToast(`AI Error on Ch ${id}: ${e.message}`, 'error');
                        }
                    }
                    this.uiState = 'idle';
                    this.statusMessage = '';
                    this.refreshIcons();
                    this.showToast('AI Enhancement complete');
                },

                generateMarkdown() {
                    let md = `# ${this.storyData.story.title}\n`;
                    md += `By ${this.storyData.author.name}\n\n`;
                    const description = (this.storyData.story.description || '')
                        .split('\n')
                        .map(line => `> ${line}`)
                        .join('\n');
                    md += `${description}\n\n---\n\n`;
                    
                    Object.keys(this.chapterContent).forEach(id => {
                        const chapter = this.storyData.chapters.find(c => String(c.id) === id);
                        if(chapter) {
                            md += `## ${chapter.title}\n\n${this.turndown.turndown(this.chapterContent[id].html)}\n\n---\n\n`;
                        }
                    });
                    return md;
                },

                generateMetadataJson() {
                    return JSON.stringify(this.storyData, null, 2);
                },

                async copyMetadataJson() {
                    const json = this.generateMetadataJson();
                    await navigator.clipboard.writeText(json);
                    this.showToast('Full metadata JSON copied!');
                },

                async copyMarkdown() {
                    if (!this.storyData) return this.showToast('Load a story first', 'error');
                    const md = this.generateMarkdown();
                    await navigator.clipboard.writeText(md);
                    this.showToast('Markdown copied to clipboard!');
                },

                downloadMarkdown() {
                    if (!this.storyData) return this.showToast('Load a story first', 'error');
                    const md = this.generateMarkdown();
                    const blob = new Blob([md], { type: 'text/markdown' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${this.storyData.story.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.md`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    this.showToast('Download started');
                }
            };
        }

        // --- THE PARSER (Minified Logic) ---
        function extractAllWattpadStoryData(htmlString) {
            const regex = /window\.__remixContext\s*=\s*(\{.*?\});<\/script>/s;
            const match = htmlString.match(regex);
            if (!match || !match[1]) throw new Error("Could not find internal story data.");
            const remixData = JSON.parse(match[1]);
            const rootData = remixData.state.loaderData.root;
            const storyPageData = remixData.state.loaderData["routes/story.$storyid"];
            const storyData = storyPageData.story;
            const categoryDictionary = rootData.wattpad.categoryList || {};
            const resolvedCategories = (storyData.categories || []).map(id => ({
                id,
                name: categoryDictionary[id] || `Unknown (${id})`
            }));

            return {
                story: {
                    id: storyData.id,
                    title: storyData.title,
                    url: storyData.url,
                    description: storyData.description,
                    cover: storyData.cover,
                    coverTimestamp: storyData.cover_timestamp,
                    language: storyData.language || null,
                    categories: resolvedCategories,
                    tags: storyData.tags || [],
                    storyTags: storyData.storyTags || [],
                    badges: storyData.badges || [],
                    copyright: storyData.copyright,
                    rating: storyData.rating,
                    completed: storyData.completed,
                    draft: storyData.draft,
                    deleted: storyData.deleted,
                    partOfSeries: storyData.isPartOfSeries,
                    hasBonusParts: storyData.hasBonusParts,
                    newParts: storyData.numNewParts,
                    newBonusParts: storyData.numNewBonusParts,
                    createdAt: storyData.createDate,
                    formattedCreatedAt: storyData.formattedCreateDate,
                    modifiedAt: storyData.modifyDate,
                    firstPartId: storyData.firstPartId || null,
                    firstPublishedPart: storyData.firstPublishedPart || null,
                    lastPublishedPart: storyData.lastPublishedPart || null,
                    reportUrl: storyData.storyReportUrl,
                    translateUrl: storyData.storyTranslateUrl,
                    tagRankings: storyData.tagRankings || [],
                    noIndex: storyData.noIndex
                },
                author: {
                    id: storyData.author,
                    username: storyData.user?.username || null,
                    name: storyData.user?.name || null,
                    avatar: storyData.user?.avatar || null,
                    followers: storyData.user?.numFollowers ?? null
                },
                stats: {
                    reads: storyData.readCount,
                    votes: storyData.voteCount,
                    comments: storyData.commentCount,
                    parts: storyData.numParts,
                    words: storyData.length
                },
                moderation: {
                    mature: storyData.mature,
                    brandSafetyLevel: storyData.brandSafetyLevel,
                    brandSafetySource: storyData.brandSafetySource,
                    brandSafe: storyData.isBrandSafe,
                    imagesUnderModeration: storyData.imagesUnderModeration,
                    safeFor: storyData.safe_for,
                    readerBrowseEligibility: storyData.readerBrowseEligibility,
                    writerPreviewHasBannedCover: storyData.writerPreviewHasBannedCover
                },
                monetization: {
                    adExempt: storyData.isAdExempt,
                    paidPreview: storyData.isPaidPreview,
                    paywalled: storyData.isPaywalled,
                    paidModel: storyData.paidModel
                },
                chapters: (storyData.parts || []).map(part => ({
                    id: part.id,
                    title: part.title,
                    url: part.url,
                    length: part.length,
                    createdAt: part.createDate,
                    formattedCreatedAt: part.formattedCreateDate,
                    draft: part.draft,
                    isNew: part.isNew
                }))
            };
        }
        
        function themeHandler() {
            return {
                isDark: localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches),
                toggleTheme() {
                    this.isDark = !this.isDark;
                    localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
                }
            }
        }
    </script>

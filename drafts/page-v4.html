                        <div class="flex items-center gap-4 py-12">
                            <div class="h-px bg-[var(--separator-color)] flex-1"></div>
                            <i data-lucide="book" class="w-4 h-4 text-[var(--subtle-text-color)]"></i>
                            <div class="h-px bg-[var(--separator-color)] flex-1"></div>
                        </div>
                    </div>
                </template>
            </div>

        </section>
    </div>

    <script>
        const CONFIG = {
            CORS_PROXY: 'https://flare.farel.is-a.dev/conduit/?url=',
            API_WATT: 'https://www.wattpad.com/apiv2/storytext?id=',
            PROMPTS: {
                'proofread': {
                  label: 'Proofread',
                  text: 'Please proofread the following HTML content for any grammatical errors, spelling mistakes, and typos. Correct them to improve clarity and readability. Ensure the output is valid HTML and preserves the original tags and structure, only modifying the text content where necessary. Do not change the original style or voice. Output only the modified HTML.'
                },
                'format': {
                  label: 'Enhance',
                  text: 'Rewrite the following chapter, provided as HTML content, to be more descriptive and engaging. Enhance the sensory details (sight, sound, smell, touch, taste) and improve the pacing. Make the characters\' emotions more palpable. The output must be valid HTML, preserving the original structure and tags, only modifying the text content. Output only the modified HTML.'
                },
                'summarize': {
                  label: 'Summarize',
                  text: 'Create a detailed bullet-point summary of the following story chapter. Wrap the output in a <div>. Output only the modified HTML.'
                },
                'translate': {
                  label: 'Translate',
                  text: 'Translate the following story chapter to {{placeholder}}. Output only the modified HTML.',
                  placeholder: {
                    label: 'Target',
                    default: 'spanish',
                    options: [
                        { value: 'english', label: 'English' },
                        { value: 'mandarin-chinese', label: 'Mandarin Chinese' },
                        { value: 'hindi', label: 'Hindi' },
                        { value: 'spanish', label: 'Spanish' },
                        { value: 'french', label: 'French' },
                        { value: 'arabic', label: 'Arabic' },
                        { value: 'bengali', label: 'Bengali' },
                        { value: 'portuguese', label: 'Portuguese' },
                        { value: 'russian', label: 'Russian' },
                        { value: 'urdu', label: 'Urdu' },
                        { value: 'indonesian', label: 'Indonesian' },
                        { value: 'german', label: 'German' },
                        { value: 'japanese', label: 'Japanese' },
                        { value: 'nigerian-pidgin', label: 'Nigerian Pidgin' },
                        { value: 'marathi', label: 'Marathi' },
                        { value: 'telugu', label: 'Telugu' },
                        { value: 'turkish', label: 'Turkish' },
                        { value: 'tamil', label: 'Tamil' },
                        { value: 'yue-chinese', label: 'Yue Chinese (Cantonese)' },
                        { value: 'wu-chinese', label: 'Wu Chinese' },
                        { value: 'korean', label: 'Korean' },
                        { value: 'vietnamese', label: 'Vietnamese' },
                        { value: 'hausa', label: 'Hausa' },
                        { value: 'thai', label: 'Thai' },
                        { value: 'javanese', label: 'Javanese' },
                        { value: 'italian', label: 'Italian' },
                        { value: 'egyptian-arabic', label: 'Egyptian Arabic' },
                        { value: 'gujarati', label: 'Gujarati' },
                        { value: 'iranian-persian', label: 'Iranian Persian' },
                        { value: 'bhojpuri', label: 'Bhojpuri' },
                        { value: 'southern-min', label: 'Southern Min' },
                        { value: 'min-nan-chinese', label: 'Min Nan Chinese' },
                        { value: 'hakka-chinese', label: 'Hakka Chinese' },
                        { value: 'jin-chinese', label: 'Jin Chinese' },
                        { value: 'filipino', label: 'Filipino' },
                        { value: 'polish', label: 'Polish' },
                        { value: 'pashto', label: 'Pashto' },
                        { value: 'kannada', label: 'Kannada' },
                        { value: 'malayalam', label: 'Malayalam' },
                        { value: 'sundanese', label: 'Sundanese' },
                        { value: 'romanian', label: 'Romanian' },
                        { value: 'ukrainian', label: 'Ukrainian' },
                        { value: 'yoruba', label: 'Yoruba' },
                        { value: 'maithili', label: 'Maithili' },
                        { value: 'burmese', label: 'Burmese' },
                        { value: 'odia', label: 'Odia' },
                        { value: 'assamese', label: 'Assamese' },
                        { value: 'sindhi', label: 'Sindhi' },
                        { value: 'algerian-arabic', label: 'Algerian Arabic' },
                        { value: 'saraiki', label: 'Saraiki' },
                        { value: 'amharic', label: 'Amharic' },
                        { value: 'moroccan-arabic', label: 'Moroccan Arabic' },
                        { value: 'tagalog', label: 'Tagalog' },
                        { value: 'dutch', label: 'Dutch' }
                    ]
                  }
                },
            }
        };

        const proxiedUrl = (url) => CONFIG.CORS_PROXY + encodeURIComponent(url);

        function wattpadApp() {
            return {
                url: '',
                aiConfig: {
                    baseUrl: 'https://api.openai.com/v1',
                    apiKey: '',
                    model: 'gpt-4o-mini'
                },
                showAi: false,
                uiState: 'idle',
                statusMessage: '', // The Notif State
                toast: { visible: false, message: '', type: 'success' },
                
                storyData: null,
                chapterRangeInput: '',
                selectedIds: [],
                chapterWorkflows: {},
                workflowRuns: [],
                activeGlobalRunId: null,
                actionPanelExpanded: false,
                selectedPromptKey: 'proofread',
                showPromptMenu: false,
                selectedPromptPlaceholderPreset: 'spanish',
                promptPlaceholderInput: '',
                showPlaceholderMenu: false,
                turndown: null,

                init() {
                    if (typeof TurndownService !== 'undefined') this.turndown = new TurndownService({ headingStyle: 'atx' });
                    
                    // Load Config
                    const saved = localStorage.getItem('wattpad_config');
                    if (saved) {
                        try {
                            this.aiConfig = { ...this.aiConfig, ...JSON.parse(saved) };
                        } catch(e) {}
                    }
                    this.syncResponsiveState();
                    window.addEventListener('resize', () => this.syncResponsiveState());
                    this.refreshIcons();
                },

                syncResponsiveState() {
                    this.actionPanelExpanded = window.innerWidth >= 640;
                },

                saveConfig() {
                    localStorage.setItem('wattpad_config', JSON.stringify(this.aiConfig));
                },

                showToast(msg, type = 'success') {
                    this.toast.message = msg;
                    this.toast.type = type;
                    this.toast.visible = true;
                    setTimeout(() => this.toast.visible = false, 3000);
                },

                get isLoadingAny() { return ['loadingMeta', 'loadingChapters', 'rewritingChapters'].includes(this.uiState); },
                get fetchedChapterIds() {
                    if (!this.storyData?.chapters?.length) return [];
                    return this.storyData.chapters
                        .map(part => String(part.id))
                        .filter(id => this.chapterWorkflows[id]?.sourceHtml);
                },
                get hasFetchedChapters() { return this.fetchedChapterIds.length > 0; },
                get hasAnyContent() { return this.hasFetchedChapters; },
                get currentPromptConfig() { return CONFIG.PROMPTS[this.selectedPromptKey] || null; },
                get currentPromptPlaceholder() { return this.currentPromptConfig?.placeholder || null; },
                get currentPromptPlaceholderOptions() { return this.currentPromptPlaceholder?.options || []; },
                get workflowStorageKey() {
                    return this.storyData?.story?.id ? `wattpad_workflow_${this.storyData.story.id}` : '';
                },

                refreshIcons() { this.$nextTick(() => lucide.createIcons()); },

                getPromptPlaceholderValue() {
                    const options = this.currentPromptPlaceholderOptions;
                    if (!options.length) return this.promptPlaceholderInput.trim();
                    const selected = options.find(option => option.value === this.selectedPromptPlaceholderPreset);
                    return selected?.label || options[0]?.label || '';
                },

                resolvePromptText() {
                    const promptText = this.currentPromptConfig?.text || '';
                    if (!promptText.includes('{{placeholder}}')) return promptText;
                    return promptText.replaceAll('{{placeholder}}', this.getPromptPlaceholderValue());
                },

                validatePromptPlaceholder() {
                    if (!this.currentPromptPlaceholder) return true;
                    if (this.getPromptPlaceholderValue()) return true;
                    this.showToast(`Please select or enter a ${this.currentPromptPlaceholder.label.toLowerCase()}`, 'error');
                    return false;
                },

                newWorkflowId(prefix) {
                    if (window.crypto?.randomUUID) return `${prefix}-${window.crypto.randomUUID()}`;
                    return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
                },

                createSourceNode(chapterId, html) {
                    return {
                        id: `source-${chapterId}`,
                        chapterId,
                        parentNodeId: null,
                        runId: null,
                        branchNumber: 0,
                        rootSource: 'source',
                        scope: 'source',
                        promptKey: 'source',
                        promptLabel: 'Source',
                        promptTextResolved: '',
                        placeholderValue: '',
                        html,
                        createdAt: Date.now(),
                        stage: 'done',
                        statusLabel: '',
                        isAi: false,
                        isStreaming: false,
                        error: '',
                        streamBuffer: '',
                        flushScheduled: false
                    };
                },

                createEmptyChapterWorkflow(chapterId) {
                    return {
                        chapterId,
                        sourceHtml: '',
                        rootNodeId: '',
                        activeNodeId: '',
                        headNodeId: '',
                        lastGlobalNodeId: '',
                        localRunCount: 0,
                        showHistory: false,
                        nodes: {}
                    };
                },

                ensureChapterWorkflow(id) {
                    if (!this.chapterWorkflows[id]) {
                        this.chapterWorkflows[id] = this.createEmptyChapterWorkflow(id);
                    }
                    return this.chapterWorkflows[id];
                },

                initializeChapterWorkflow(id, html) {
                    const rootNode = this.createSourceNode(id, html);
                    this.chapterWorkflows[id] = {
                        chapterId: id,
                        sourceHtml: html,
                        rootNodeId: rootNode.id,
                        activeNodeId: rootNode.id,
                        headNodeId: rootNode.id,
                        lastGlobalNodeId: rootNode.id,
                        localRunCount: 0,
                        showHistory: false,
                        nodes: { [rootNode.id]: rootNode }
                    };
                },

                buildPromptExecution() {
                    return {
                        promptKey: this.selectedPromptKey,
                        promptLabel: this.currentPromptConfig?.label || 'Prompt',
                        promptTextResolved: this.resolvePromptText(),
                        placeholderValue: this.getPromptPlaceholderValue()
                    };
                },

                createWorkflowNode({ chapterId, parentNodeId, scope, promptKey, promptLabel, promptTextResolved, placeholderValue, runId = null, branchNumber = 0 }) {
                    const parentNode = parentNodeId ? this.getNode(chapterId, parentNodeId) : null;
                    return {
                        id: this.newWorkflowId(scope === 'global' ? 'global' : 'chapter'),
                        chapterId,
                        parentNodeId,
                        runId,
                        branchNumber,
                        rootSource: parentNode?.isAi ? 'ai' : 'source',
                        scope,
                        promptKey,
                        promptLabel,
                        promptTextResolved,
                        placeholderValue,
                        html: '',
                        createdAt: Date.now(),
                        stage: 'queued',
                        statusLabel: '',
                        isAi: true,
                        isStreaming: false,
                        error: '',
                        streamBuffer: '',
                        flushScheduled: false
                    };
                },

                addNodeToChapter(id, node, options = {}) {
                    const { setActive = true, setHead = true, setLastGlobal = false } = options;
                    const state = this.ensureChapterWorkflow(id);
                    state.nodes = { ...state.nodes, [node.id]: node };
                    if (setActive) state.activeNodeId = node.id;
                    if (setHead) state.headNodeId = node.id;
                    if (setLastGlobal) state.lastGlobalNodeId = node.id;
                },

                hydrateWorkflowNode(chapterId, rawNode) {
                    return {
                        id: rawNode.id,
                        chapterId,
                        parentNodeId: rawNode.parentNodeId ?? null,
                        runId: rawNode.runId ?? null,
                        branchNumber: rawNode.branchNumber ?? 0,
                        rootSource: rawNode.rootSource || 'source',
                        scope: rawNode.scope || 'source',
                        promptKey: rawNode.promptKey || 'source',
                        promptLabel: rawNode.promptLabel || 'Source',
                        promptTextResolved: rawNode.promptTextResolved || '',
                        placeholderValue: rawNode.placeholderValue || '',
                        html: rawNode.html || '',
                        createdAt: rawNode.createdAt || Date.now(),
                        stage: rawNode.stage || 'idle',
                        statusLabel: rawNode.statusLabel || '',
                        isAi: !!rawNode.isAi,
                        isStreaming: !!rawNode.isStreaming,
                        error: rawNode.error || '',
                        streamBuffer: '',
                        flushScheduled: false
                    };
                },

                restoreWorkflowState() {
                    this.chapterWorkflows = {};
                    this.workflowRuns = [];
                    this.activeGlobalRunId = null;
                    if (!this.workflowStorageKey) return;

                    const saved = localStorage.getItem(this.workflowStorageKey);
                    if (!saved) return;

                    try {
                        const parsed = JSON.parse(saved);
                        const rawWorkflows = parsed.chapterWorkflows || {};
                        this.chapterWorkflows = Object.fromEntries(Object.entries(rawWorkflows).map(([id, state]) => {
                            const nodes = Object.fromEntries(Object.entries(state.nodes || {}).map(([nodeId, node]) => [nodeId, this.hydrateWorkflowNode(id, node)]));
                            return [id, {
                                chapterId: id,
                                sourceHtml: state.sourceHtml || '',
                                rootNodeId: state.rootNodeId || '',
                                activeNodeId: state.activeNodeId || state.rootNodeId || '',
                                headNodeId: state.headNodeId || state.activeNodeId || state.rootNodeId || '',
                                lastGlobalNodeId: state.lastGlobalNodeId || state.rootNodeId || '',
                                localRunCount: state.localRunCount || 0,
                                showHistory: false,
                                nodes
                            }];
                        }));
                        this.workflowRuns = Array.isArray(parsed.workflowRuns) ? parsed.workflowRuns : [];
                        this.activeGlobalRunId = parsed.activeGlobalRunId ?? null;
                    } catch (e) {
                        console.error(e);
                    }
                },

                persistWorkflowState() {
                    if (!this.workflowStorageKey) return;
                    const chapterWorkflows = Object.fromEntries(Object.entries(this.chapterWorkflows).map(([id, state]) => {
                        const nodes = Object.fromEntries(Object.entries(state.nodes || {}).map(([nodeId, node]) => [nodeId, {
                            id: node.id,
                            chapterId: node.chapterId,
                            parentNodeId: node.parentNodeId,
                            runId: node.runId,
                            branchNumber: node.branchNumber,
                            rootSource: node.rootSource,
                            scope: node.scope,
                            promptKey: node.promptKey,
                            promptLabel: node.promptLabel,
                            promptTextResolved: node.promptTextResolved,
                            placeholderValue: node.placeholderValue,
                            html: node.html,
                            createdAt: node.createdAt,
                            stage: node.stage,
                            statusLabel: node.statusLabel,
                            isAi: node.isAi,
                            isStreaming: false,
                            error: node.error
                        }]));
                        return [id, {
                            chapterId: state.chapterId,
                            sourceHtml: state.sourceHtml,
                            rootNodeId: state.rootNodeId,
                            activeNodeId: state.activeNodeId,
                            headNodeId: state.headNodeId,
                            lastGlobalNodeId: state.lastGlobalNodeId,
                            localRunCount: state.localRunCount,
                            nodes
                        }];
                    }));
                    localStorage.setItem(this.workflowStorageKey, JSON.stringify({
                        storyId: this.storyData?.story?.id,
                        chapterWorkflows,
                        workflowRuns: this.workflowRuns,
                        activeGlobalRunId: this.activeGlobalRunId
                    }));
                },

                getNode(chapterId, nodeId) {
                    return this.chapterWorkflows[chapterId]?.nodes?.[nodeId] || null;
                },

                getActiveNode(chapterId) {
                    const state = this.chapterWorkflows[chapterId];
                    if (!state) return null;
                    return state.nodes?.[state.activeNodeId] || state.nodes?.[state.rootNodeId] || null;
                },

                getNodeSourceHtml(chapterId, node) {
                    if (!node) return '';
                    if (!node.parentNodeId) return this.chapterWorkflows[chapterId]?.sourceHtml || node.html || '';
                    return this.getNode(chapterId, node.parentNodeId)?.html || this.chapterWorkflows[chapterId]?.sourceHtml || '';
                },

                getChapterDisplayHtml(chapterId) {
                    const node = this.getActiveNode(chapterId);
                    if (!node) return '';
                    if (!node.isAi || node.scope === 'source') return node.html || '';
                    if (['queued', 'processing'].includes(node.stage)) return this.getNodeSourceHtml(chapterId, node);
                    if (node.stage === 'error') return node.html || this.getNodeSourceHtml(chapterId, node);
                    return node.html || '';
                },

                setNodeState(chapterId, nodeId, patch) {
                    const state = this.chapterWorkflows[chapterId];
                    if (!state?.nodes?.[nodeId]) return;
                    state.nodes[nodeId] = { ...state.nodes[nodeId], ...patch };
                },

                queueNodeHtml(chapterId, nodeId, chunk) {
                    if (!chunk) return;
                    const entry = this.getNode(chapterId, nodeId);
                    if (!entry) return;

                    entry.streamBuffer = (entry.streamBuffer || '') + chunk;
                    if (entry.flushScheduled) return;

                    entry.flushScheduled = true;
                    requestAnimationFrame(() => {
                        const current = this.getNode(chapterId, nodeId);
                        if (!current) return;
                        current.html += current.streamBuffer || '';
                        current.streamBuffer = '';
                        current.flushScheduled = false;
                    });
                },

                flushNodeHtml(chapterId, nodeId) {
                    const entry = this.getNode(chapterId, nodeId);
                    if (!entry?.streamBuffer) return;
                    entry.html += entry.streamBuffer;
                    entry.streamBuffer = '';
                    entry.flushScheduled = false;
                },

                extractStreamContent(payload) {
                    const delta = payload?.choices?.[0]?.delta?.content;
                    if (typeof delta === 'string') return delta;
                    if (Array.isArray(delta)) {
                        return delta.map(item => typeof item === 'string' ? item : item?.text || '').join('');
                    }
                    return '';
                },

                async streamChatCompletion(chapterId, nodeId, sourceHtml, promptTextResolved) {
                    const res = await fetch(proxiedUrl(`${this.aiConfig.baseUrl}/chat/completions`), {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.aiConfig.apiKey}`
                        },
                        body: JSON.stringify({
                            model: this.aiConfig.model,
                            stream: true,
                            messages: [
                                { role: 'system', content: promptTextResolved },
                                { role: 'user', content: sourceHtml }
                            ]
                        })
                    });

                    if (!res.ok) throw new Error(`API Error: ${res.status}`);

                    if (!res.body) {
                        const fallbackData = await res.json();
                        return fallbackData?.choices?.[0]?.message?.content || '';
                    }

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let streamedHtml = '';

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const events = buffer.split('\n\n');
                        buffer = events.pop() || '';

                        for (const event of events) {
                            const lines = event.split('\n').filter(line => line.startsWith('data: '));
                            for (const line of lines) {
                                const data = line.slice(6).trim();
                                if (!data || data === '[DONE]') continue;

                                let payload;
                                try {
                                    payload = JSON.parse(data);
                                } catch {
                                    continue;
                                }

                                const chunk = this.extractStreamContent(payload);
                                if (!chunk) continue;

                                streamedHtml += chunk;
                                this.setNodeState(chapterId, nodeId, {
                                    isAi: true,
                                    isStreaming: true,
                                    stage: 'generating',
                                    statusLabel: 'Generating live...'
                                });
                                this.queueNodeHtml(chapterId, nodeId, chunk);
                            }
                        }
                    }

                    return streamedHtml;
                },

                formatNumber(num) {
                    if(!num) return '0';
                    if(num >= 1000000) return (num/1000000).toFixed(1) + 'M';
                    if(num >= 1000) return (num/1000).toFixed(1) + 'K';
                    return num.toLocaleString();
                },

                toggleId(id) {
                    if (this.selectedIds.includes(id)) {
                        this.selectedIds = this.selectedIds.filter(x => x !== id);
                    } else {
                        this.selectedIds.push(id);
                    }
                },
                toggleSelectAll(forceState) {
                    if (forceState) {
                        this.selectedIds = this.storyData.chapters.map(c => String(c.id));
                    } else {
                        this.selectedIds = [];
                    }
                },

                parseChapterRange(rangeString, maxIndex) {
                    const indices = new Set();
                    if (!rangeString || typeof rangeString !== 'string' || maxIndex <= 0) return [];

                    for (const part of rangeString.split(',')) {
                        const trimmed = part.trim();
                        if (!trimmed) continue;

                        if (trimmed.includes('-')) {
                            const [startRaw, endRaw] = trimmed.split('-').map(v => parseInt(v.trim(), 10));
                            if (Number.isNaN(startRaw) || Number.isNaN(endRaw)) continue;
                            const start = Math.max(1, Math.min(startRaw, endRaw));
                            const end = Math.min(maxIndex, Math.max(startRaw, endRaw));
                            for (let i = start; i <= end; i++) indices.add(i);
                        } else {
                            const value = parseInt(trimmed, 10);
                            if (!Number.isNaN(value) && value >= 1 && value <= maxIndex) indices.add(value);
                        }
                    }

                    return Array.from(indices).sort((a, b) => a - b);
                },

                applyChapterRange() {
                    if (!this.storyData?.chapters?.length) return;
                    const indices = this.parseChapterRange(this.chapterRangeInput, this.storyData.chapters.length);

                    if (!indices.length) {
                        this.showToast('Invalid chapter range', 'error');
                        return;
                    }

                    this.selectedIds = indices
                        .map(index => this.storyData.chapters[index - 1])
                        .filter(Boolean)
                        .map(chapter => String(chapter.id));
                },

                async fetchMetadata() {
                    if (!this.url.includes('wattpad.com/story/')) return this.showToast('Invalid Wattpad URL', 'error');
                    
                    this.uiState = 'loadingMeta';
                    this.statusMessage = 'Extracting story metadata...';
                    
                    try {
                        const res = await fetch(proxiedUrl(this.url));
                        const html = await res.text();
                        this.storyData = extractAllWattpadStoryData(html); // Using the previous parsing logic
                        this.chapterRangeInput = '';
                        this.selectedIds = [];
                        this.restoreWorkflowState();
                        this.showToast('Story loaded successfully');
                    } catch (e) {
                        this.showToast(e.message, 'error');
                    } finally {
                        this.uiState = 'idle';
                        this.statusMessage = '';
                        this.refreshIcons();
                    }
                },

                async fetchChapters() {
                    this.uiState = 'loadingChapters';
                    let count = 0;
                    
                    for (const id of this.selectedIds) {
                        count++;
                        this.statusMessage = `Fetching chapter ${count}/${this.selectedIds.length}...`;
                        try {
                            const res = await fetch(proxiedUrl(CONFIG.API_WATT + id));
                            const html = await res.text();
                            this.initializeChapterWorkflow(id, html);
                        } catch (e) { console.error(e); }
                    }
                    this.uiState = 'idle';
                    this.statusMessage = '';
                    this.persistWorkflowState();
                    this.refreshIcons();
                    this.showToast(`Fetched ${count} chapters`);
                },

                getNodeScopeLabel(scope) {
                    if (scope === 'global') return 'Global';
                    if (scope === 'chapter') return 'Chapter';
                    return 'Source';
                },

                getNodeScopeClasses(scope) {
                    if (scope === 'global') return 'bg-primary-100/80 dark:bg-primary-500/15 text-primary-700 dark:text-primary-400 border-primary-200 dark:border-primary-500/20';
                    if (scope === 'chapter') return 'bg-secondary-100/80 dark:bg-secondary-500/15 text-secondary-700 dark:text-secondary-300 border-secondary-200 dark:border-secondary-500/20';
                    return 'bg-[var(--bg-color)] text-[var(--subtle-text-color)] border-[var(--card-border)]';
                },

                getRunNumber(runId) {
                    return this.workflowRuns.find(run => run.id === runId)?.number || 0;
                },

                getNodeDisplayName(node) {
                    if (!node) return 'Unknown';
                    if (node.scope === 'source') return 'Source';
                    if (node.scope === 'global') return `Thread ${this.getRunNumber(node.runId)} - ${node.promptLabel}`;
                    return `Branch ${node.branchNumber} - ${node.promptLabel}`;
                },

                formatWorkflowDate(timestamp) {
                    if (!timestamp) return 'Unknown time';
                    return new Date(timestamp).toLocaleString();
                },

                getNodeMetaLine(node, chapterId) {
                    if (!node) return '';
                    const parentNode = node.parentNodeId ? this.getNode(chapterId, node.parentNodeId) : null;
                    const parentLabel = parentNode ? this.getNodeDisplayName(parentNode) : 'None';
                    const suffix = node.placeholderValue ? ` | Target: ${node.placeholderValue}` : '';
                    return `Parent: ${parentLabel} | ${this.formatWorkflowDate(node.createdAt)}${suffix}`;
                },

                getChapterHistory(chapterId) {
                    const nodes = Object.values(this.chapterWorkflows[chapterId]?.nodes || {});
                    return nodes.sort((a, b) => {
                        if (a.scope === 'source') return -1;
                        if (b.scope === 'source') return 1;
                        return a.createdAt - b.createdAt;
                    });
                },

                toggleChapterHistory(chapterId) {
                    const state = this.chapterWorkflows[chapterId];
                    if (!state) return;
                    state.showHistory = !state.showHistory;
                    this.refreshIcons();
                },

                setActiveChapterNode(chapterId, nodeId) {
                    const state = this.chapterWorkflows[chapterId];
                    if (!state?.nodes?.[nodeId]) return;
                    state.activeNodeId = nodeId;
                    this.persistWorkflowState();
                },

                activateGlobalSource() {
                    this.activeGlobalRunId = null;
                    this.fetchedChapterIds.forEach(id => {
                        const state = this.chapterWorkflows[id];
                        if (state?.rootNodeId) state.activeNodeId = state.rootNodeId;
                    });
                    this.persistWorkflowState();
                },

                activateGlobalRun(runId) {
                    const run = this.workflowRuns.find(item => item.id === runId);
                    if (!run) return;
                    this.activeGlobalRunId = runId;
                    this.fetchedChapterIds.forEach(id => {
                        const nodeId = run.nodeIdsByChapter?.[id];
                        if (nodeId && this.chapterWorkflows[id]?.nodes?.[nodeId]) {
                            this.chapterWorkflows[id].activeNodeId = nodeId;
                        }
                    });
                    this.persistWorkflowState();
                },

                async rewriteSingleChapter(id) {
                    if (!this.aiConfig.apiKey) return this.showToast('Please enter an API Key in settings', 'error');
                    if (!this.validatePromptPlaceholder()) return;
                    const state = this.chapterWorkflows[id];
                    const activeNode = this.getActiveNode(id);
                    if (!state?.sourceHtml || !activeNode) return this.showToast('Fetch the chapter first', 'error');

                    const execution = this.buildPromptExecution();
                    const branchNumber = (state.localRunCount || 0) + 1;
                    const node = this.createWorkflowNode({
                        chapterId: id,
                        parentNodeId: state.activeNodeId,
                        scope: 'chapter',
                        promptKey: execution.promptKey,
                        promptLabel: execution.promptLabel,
                        promptTextResolved: execution.promptTextResolved,
                        placeholderValue: execution.placeholderValue,
                        branchNumber
                    });

                    state.localRunCount = branchNumber;
                    this.addNodeToChapter(id, node, { setActive: true, setHead: true, setLastGlobal: false });
                    this.uiState = 'rewritingChapters';
                    this.statusMessage = 'Generating chapter 1/1...';
                    this.setNodeState(id, node.id, {
                        stage: 'processing',
                        statusLabel: 'Preparing AI stream (1/1)...',
                        isStreaming: false
                    });
                    this.persistWorkflowState();
                    this.$nextTick(() => this.refreshIcons());

                    try {
                        const finalHtml = await this.streamChatCompletion(id, node.id, activeNode.html, execution.promptTextResolved);
                        this.flushNodeHtml(id, node.id);
                        this.setNodeState(id, node.id, {
                            html: finalHtml || this.getNode(id, node.id)?.html || '',
                            isAi: true,
                            isStreaming: false,
                            stage: 'done',
                            statusLabel: '',
                            streamBuffer: '',
                            flushScheduled: false,
                            error: ''
                        });
                        this.persistWorkflowState();
                        this.showToast('AI Enhancement complete');
                    } catch (e) {
                        console.error(e);
                        this.flushNodeHtml(id, node.id);
                        this.setNodeState(id, node.id, {
                            isStreaming: false,
                            stage: 'error',
                            statusLabel: '',
                            error: e.message
                        });
                        this.persistWorkflowState();
                        this.showToast(`AI Error on Ch ${id}: ${e.message}`, 'error');
                    } finally {
                        this.uiState = 'idle';
                        this.statusMessage = '';
                        this.refreshIcons();
                    }
                },

                async rewriteChapters() {
                    if (!this.aiConfig.apiKey) return this.showToast('Please enter an API Key in settings', 'error');
                    if (!this.validatePromptPlaceholder()) return;
                    
                    this.uiState = 'rewritingChapters';
                    const ids = this.fetchedChapterIds;
                    if (!ids.length) {
                        this.uiState = 'idle';
                        return this.showToast('Fetch chapters first', 'error');
                    }

                    const execution = this.buildPromptExecution();
                    const run = {
                        id: this.newWorkflowId('run'),
                        number: this.workflowRuns.length + 1,
                        createdAt: Date.now(),
                        parentRunId: this.activeGlobalRunId,
                        promptKey: execution.promptKey,
                        promptLabel: execution.promptLabel,
                        promptTextResolved: execution.promptTextResolved,
                        placeholderValue: execution.placeholderValue,
                        chapterIds: [...ids],
                        nodeIdsByChapter: {}
                    };
                    let count = 0;

                    ids.forEach((id, index) => {
                        const state = this.chapterWorkflows[id];
                        const parentNodeId = state?.lastGlobalNodeId || state?.rootNodeId || null;
                        const node = this.createWorkflowNode({
                            chapterId: id,
                            parentNodeId,
                            scope: 'global',
                            promptKey: execution.promptKey,
                            promptLabel: execution.promptLabel,
                            promptTextResolved: execution.promptTextResolved,
                            placeholderValue: execution.placeholderValue,
                            runId: run.id
                        });
                        this.addNodeToChapter(id, node, { setActive: true, setHead: true, setLastGlobal: true });
                        this.setNodeState(id, node.id, {
                            stage: 'queued',
                            statusLabel: `Waiting for AI (${index + 1}/${ids.length})...`,
                            isStreaming: false
                        });
                        run.nodeIdsByChapter[id] = node.id;
                    });

                    this.workflowRuns = [...this.workflowRuns, run];
                    this.activeGlobalRunId = run.id;
                    this.persistWorkflowState();
                    this.refreshIcons();

                    for (const id of ids) {
                        count++;
                        this.statusMessage = `Generating chapter ${count}/${ids.length}...`;
                        try {
                            const nodeId = run.nodeIdsByChapter[id];
                            const parentNode = this.getNode(id, this.getNode(id, nodeId)?.parentNodeId);
                            this.setNodeState(id, nodeId, {
                                isAi: true,
                                isStreaming: false,
                                stage: 'processing',
                                statusLabel: `Preparing AI stream (${count}/${ids.length})...`
                            });
                            this.$nextTick(() => this.refreshIcons());

                            const finalHtml = await this.streamChatCompletion(id, nodeId, parentNode?.html || this.chapterWorkflows[id]?.sourceHtml || '', execution.promptTextResolved);
                            this.flushNodeHtml(id, nodeId);
                            this.setNodeState(id, nodeId, {
                                html: finalHtml || this.getNode(id, nodeId)?.html || '',
                                isAi: true,
                                isStreaming: false,
                                stage: 'done',
                                statusLabel: '',
                                streamBuffer: '',
                                flushScheduled: false,
                                error: ''
                            });
                            this.persistWorkflowState();
                        } catch (e) { 
                            console.error(e);
                            const nodeId = run.nodeIdsByChapter[id];
                            this.flushNodeHtml(id, nodeId);
                            this.setNodeState(id, nodeId, {
                                isStreaming: false,
                                stage: 'error',
                                statusLabel: '',
                                error: e.message
                            });
                            this.persistWorkflowState();
                            this.showToast(`AI Error on Ch ${id}: ${e.message}`, 'error');
                        }
                    }
                    this.uiState = 'idle';
                    this.statusMessage = '';
                    this.refreshIcons();
                    this.showToast('AI Enhancement complete');
                },

                generateMarkdown() {
                    let md = `# ${this.storyData.story.title}\n`;
                    md += `By ${this.storyData.author.name}\n\n`;
                    const description = (this.storyData.story.description || '')
                        .split('\n')
                        .map(line => `> ${line}`)
                        .join('\n');
                    md += `${description}\n\n---\n\n`;
                    
                    this.storyData.chapters.forEach(part => {
                        const id = String(part.id);
                        const html = this.getActiveNode(id)?.html;
                        if (html) {
                            md += `## ${part.title}\n\n${this.turndown.turndown(html)}\n\n---\n\n`;
                        }
                    });
                    return md;
                },

                generateMetadataJson() {
                    return JSON.stringify(this.storyData, null, 2);
                },

                async copyMetadataJson() {
                    const json = this.generateMetadataJson();
                    await navigator.clipboard.writeText(json);
                    this.showToast('Full metadata JSON copied!');
                },

                async copyMarkdown() {
                    if (!this.storyData) return this.showToast('Load a story first', 'error');
                    const md = this.generateMarkdown();
                    await navigator.clipboard.writeText(md);
                    this.showToast('Markdown copied to clipboard!');
                },

                downloadMarkdown() {
                    if (!this.storyData) return this.showToast('Load a story first', 'error');
                    const md = this.generateMarkdown();
                    const blob = new Blob([md], { type: 'text/markdown' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${this.storyData.story.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.md`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    this.showToast('Download started');
                }
            };
        }

        // --- THE PARSER (Minified Logic) ---
        function extractAllWattpadStoryData(htmlString) {
            const regex = /window\.__remixContext\s*=\s*(\{.*?\});<\/script>/s;
            const match = htmlString.match(regex);
            if (!match || !match[1]) throw new Error("Could not find internal story data.");
            const remixData = JSON.parse(match[1]);
            const rootData = remixData.state.loaderData.root;
            const storyPageData = remixData.state.loaderData["routes/story.$storyid"];
            const storyData = storyPageData.story;
            const categoryDictionary = rootData.wattpad.categoryList || {};
            const resolvedCategories = (storyData.categories || []).map(id => ({
                id,
                name: categoryDictionary[id] || `Unknown (${id})`
            }));

            return {
                story: {
                    id: storyData.id,
                    title: storyData.title,
                    url: storyData.url,
                    description: storyData.description,
                    cover: storyData.cover,
                    coverTimestamp: storyData.cover_timestamp,
                    language: storyData.language || null,
                    categories: resolvedCategories,
                    tags: storyData.tags || [],
                    storyTags: storyData.storyTags || [],
                    badges: storyData.badges || [],
                    copyright: storyData.copyright,
                    rating: storyData.rating,
                    completed: storyData.completed,
                    draft: storyData.draft,
                    deleted: storyData.deleted,
                    partOfSeries: storyData.isPartOfSeries,
                    hasBonusParts: storyData.hasBonusParts,
                    newParts: storyData.numNewParts,
                    newBonusParts: storyData.numNewBonusParts,
                    createdAt: storyData.createDate,
                    formattedCreatedAt: storyData.formattedCreateDate,
                    modifiedAt: storyData.modifyDate,
                    firstPartId: storyData.firstPartId || null,
                    firstPublishedPart: storyData.firstPublishedPart || null,
                    lastPublishedPart: storyData.lastPublishedPart || null,
                    reportUrl: storyData.storyReportUrl,
                    translateUrl: storyData.storyTranslateUrl,
                    tagRankings: storyData.tagRankings || [],
                    noIndex: storyData.noIndex
                },
                author: {
                    id: storyData.author,
                    username: storyData.user?.username || null,
                    name: storyData.user?.name || null,
                    avatar: storyData.user?.avatar || null,
                    followers: storyData.user?.numFollowers ?? null
                },
                stats: {
                    reads: storyData.readCount,
                    votes: storyData.voteCount,
                    comments: storyData.commentCount,
                    parts: storyData.numParts,
                    words: storyData.length
                },
                moderation: {
                    mature: storyData.mature,
                    brandSafetyLevel: storyData.brandSafetyLevel,
                    brandSafetySource: storyData.brandSafetySource,
                    brandSafe: storyData.isBrandSafe,
                    imagesUnderModeration: storyData.imagesUnderModeration,
                    safeFor: storyData.safe_for,
                    readerBrowseEligibility: storyData.readerBrowseEligibility,
                    writerPreviewHasBannedCover: storyData.writerPreviewHasBannedCover
                },
                monetization: {
                    adExempt: storyData.isAdExempt,
                    paidPreview: storyData.isPaidPreview,
                    paywalled: storyData.isPaywalled,
                    paidModel: storyData.paidModel
                },
                chapters: (storyData.parts || []).map(part => ({
                    id: part.id,
                    title: part.title,
                    url: part.url,
                    length: part.length,
                    createdAt: part.createDate,
                    formattedCreatedAt: part.formattedCreateDate,
                    draft: part.draft,
                    isNew: part.isNew
                }))
            };
        }
        
        function themeHandler() {
            return {
                isDark: localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches),
                toggleTheme() {
                    this.isDark = !this.isDark;
                    localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
                }
            }
        }
    </script>
</body>
</html>

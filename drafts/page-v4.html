<!DOCTYPE html>
<html lang="en" x-data="themeHandler()" :class="{ 'dark': isDark }">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wattpad Pro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@latest/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown@latest/dist/turndown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: {
                    sans: ['Inter', 'sans-serif'],
                    serif: ['Merriweather', 'serif'],
                },
                extend: {
                    colors: {
                        primary: { 50: '#fff1e8', 100: '#ffd9c2', 500: '#ff6600', 600: '#e65c00', 700: '#cc5200' },
                        secondary: { 50: '#ecf5ff', 100: '#d9ecff', 500: '#409eff', 600: '#2f89eb', 700: '#2677d1' },
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --text-color: #2c3e50;
            --secondary-bg-color: #ffffff;
            --input-bg-color: #ffffff;
            --input-border-color: #dcdfe6;
            --heading-color: #34495e;
            --subtle-text-color: #8492a6;
            --separator-color: #e4e7ed;
            --card-border: #e4e7ed;
            --card-bg: #ffffff;
            --success-bg: #f0f9eb;
            --success-text: #67c23a;
            --success-border: #e1f3d8;
            --error-bg: #fef0f0;
            --error-text: #f56c6c;
            --error-border: #fde2e2;
            --button-muted-bg: #f4f4f5;
            --button-muted-text: #909399;
            --button-muted-border: #e9e9eb;
            --info-bg: #ffedd5;
            --info-text: #c2410c;
            --info-border: #fdba74;
            --tag-bg: #fff7ed;
            --tag-text: #ea580c;
            --tag-border: #fed7aa;
        }

        .dark {
            --bg-color: #1c1e21;
            --text-color: #e4e6eb;
            --secondary-bg-color: #242526;
            --input-bg-color: #3a3b3c;
            --input-border-color: #4b4d4f;
            --heading-color: #ccd0d5;
            --subtle-text-color: #a0a3a8;
            --separator-color: #3e4042;
            --card-border: #3e4042;
            --card-bg: #2d2e2f;
            --success-bg: #2a4a2a;
            --success-text: #aaffee;
            --success-border: #4a8a4a;
            --error-bg: #3a2a2a;
            --error-text: #f2aaaa;
            --error-border: #5a3a3a;
            --button-muted-bg: #3a3a3a;
            --button-muted-text: #b0b3b8;
            --button-muted-border: #555;
            --info-bg: rgba(255, 102, 0, 0.15);
            --info-text: #fdba74;
            --info-border: rgba(255, 166, 77, 0.28);
            --tag-bg: rgba(255, 102, 0, 0.10);
            --tag-text: #ffcf99;
            --tag-border: rgba(255, 166, 77, 0.2);
        }

        /* Custom scrollbar for better aesthetics */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; }
        .chapter-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 0.375rem;
            border: 1.5px solid var(--input-border-color);
            background: var(--secondary-bg-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }
        .chapter-checkbox:checked {
            background: #ff6600;
            border-color: #ff6600;
            box-shadow: 0 0 0 3px color-mix(in srgb, #ff6600 18%, transparent);
        }
        .chapter-checkbox:checked::after {
            content: '';
            width: 0.3rem;
            height: 0.55rem;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(45deg) translate(-1px, -1px);
        }
        .chapter-checkbox:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px color-mix(in srgb, #ff6600 20%, transparent);
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-[var(--bg-color)] text-[var(--text-color)] min-h-screen transition-colors duration-200 antialiased font-sans p-4 sm:p-6 lg:p-8 relative" x-data="wattpadApp()">
    
    <div x-show="toast.visible" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-2" class="fixed top-3 left-3 right-3 sm:top-4 sm:left-auto sm:right-4 sm:max-w-md z-50 px-4 py-3 rounded-lg shadow-xl flex items-center gap-3 border" :class="toast.type === 'error' ? 'bg-[var(--error-bg)] text-[var(--error-text)] border-[var(--error-border)]' : 'bg-[var(--success-bg)] text-[var(--success-text)] border-[var(--success-border)]'" x-cloak>
        <i :data-lucide="toast.type === 'error' ? 'alert-circle' : 'check-circle'" class="w-5 h-5"></i>
        <span x-text="toast.message" class="font-medium text-sm"></span>
    </div>

    <div class="max-w-5xl mx-auto space-y-6">
        
        <header class="flex items-center justify-between gap-4 bg-[var(--secondary-bg-color)] rounded-2xl shadow-sm border border-[var(--card-border)] p-5 sm:p-6">
            <div class="flex items-center gap-3">
                <div class="bg-primary-100/90 dark:bg-primary-500/15 p-2 rounded-lg text-primary-600 dark:text-primary-500">
                    <i data-lucide="book-open-check"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-[var(--heading-color)]">Wattpad <span class="text-primary-500">Pro</span></h1>
            </div>
            <button @click="toggleTheme()" class="p-2.5 rounded-xl bg-[var(--input-bg-color)] text-[var(--text-color)] hover:bg-black/5 dark:hover:bg-white/10 transition-colors border border-[var(--card-border)]">
                <i data-lucide="sun" x-show="isDark" class="w-5 h-5"></i>
                <i data-lucide="moon" x-show="!isDark" class="w-5 h-5"></i>
            </button>
        </header>

        <section class="bg-[var(--secondary-bg-color)] rounded-2xl shadow-sm border border-[var(--card-border)] p-6 space-y-6">
            <div>
                <label class="block text-sm font-semibold text-[var(--subtle-text-color)] mb-2">
                    <i data-lucide="link" class="w-4 h-4 text-primary-600 inline mr-1"></i> Wattpad URL
                </label>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" x-model="url" :disabled="isLoadingAny" @keydown.enter="fetchMetadata()" placeholder="https://www.wattpad.com/story/..." class="flex-1 px-4 py-3 bg-[var(--input-bg-color)] border border-[var(--input-border-color)] rounded-xl text-[var(--text-color)] focus:ring-2 focus:ring-primary-500 focus:border-primary-500 disabled:opacity-50 transition-all" />
                    <button @click="fetchMetadata()" :disabled="isLoadingAny || !url" class="sm:w-auto bg-primary-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-primary-700 disabled:opacity-50 flex items-center justify-center gap-2 transition-all whitespace-nowrap shadow-md hover:shadow-lg">
                        <i data-lucide="search" class="w-4 h-4" x-show="uiState !== 'loadingMeta'"></i>
                        <i data-lucide="loader-2" class="w-4 h-4 animate-spin" x-show="uiState === 'loadingMeta'"></i>
                        <span x-text="uiState === 'loadingMeta' ? 'Fetching...' : 'Analyze'"></span>
                    </button>
                </div>
            </div>

            <div class="border-t border-[var(--separator-color)] pt-4">
                <div class="flex items-center gap-2 mb-3 cursor-pointer select-none" @click="showAi = !showAi">
                    <i data-lucide="bot" class="w-4 h-4 text-primary-600"></i>
                    <span class="text-xs font-bold uppercase tracking-wider text-[var(--subtle-text-color)] hover:text-primary-600 transition-colors">AI & API Configuration</span>
                    <i data-lucide="chevron-down" class="w-3 h-3 text-[var(--subtle-text-color)] transition-transform" :class="showAi ? 'rotate-180' : ''"></i>
                </div>
                
                <div x-show="showAi" x-collapse class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-[var(--bg-color)] p-4 rounded-xl border border-[var(--card-border)]">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-medium text-[var(--subtle-text-color)] mb-1">Base URL (e.g., LocalAI/Ollama)</label>
                        <input type="text" x-model="aiConfig.baseUrl" @input="saveConfig" placeholder="https://api.openai.com/v1" class="block w-full px-3 py-2 text-sm bg-[var(--secondary-bg-color)] border border-[var(--input-border-color)] rounded-lg focus:ring-1 focus:ring-primary-500" />
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[var(--subtle-text-color)] mb-1">Model Name</label>
                        <input type="text" x-model="aiConfig.model" @input="saveConfig" placeholder="gpt-4o-mini" class="block w-full px-3 py-2 text-sm bg-[var(--secondary-bg-color)] border border-[var(--input-border-color)] rounded-lg focus:ring-1 focus:ring-primary-500" />
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[var(--subtle-text-color)] mb-1">API Key</label>
                        <input type="password" x-model="aiConfig.apiKey" @input="saveConfig" placeholder="sk-..." class="block w-full px-3 py-2 text-sm bg-[var(--secondary-bg-color)] border border-[var(--input-border-color)] rounded-lg focus:ring-1 focus:ring-primary-500" />
                    </div>
                </div>
            </div>
        </section>

        <section x-show="storyData !== null" x-transition class="space-y-6" style="display: none;">
            
            <div class="bg-[var(--secondary-bg-color)] rounded-2xl shadow-sm border border-[var(--card-border)] p-6 md:p-8">
                <template x-if="storyData">
                    <div class="flex flex-col md:flex-row gap-6">
                        <a :href="storyData.story.url" target="_blank" rel="noopener noreferrer" class="mx-auto md:mx-0">
                            <img :src="storyData.story.cover" class="w-40 md:w-48 aspect-[2/3] rounded-lg shadow-lg object-cover ring-1 ring-black/10 dark:ring-white/10 hover:opacity-95 transition-opacity">
                        </a>
                        
                        <div class="flex-1 space-y-4">
                            <h2 class="text-2xl sm:text-3xl md:text-4xl font-black font-serif leading-tight">
                                <a :href="storyData.story.url" target="_blank" rel="noopener noreferrer" class="text-[var(--heading-color)] hover:text-primary-500 transition-colors" x-text="storyData.story.title"></a>
                            </h2>
                              
                            <div class="flex flex-wrap items-center gap-3">
                                <img :src="storyData.author.avatar" class="w-8 h-8 rounded-full border border-[var(--card-border)]">
                                <p class="font-bold text-[var(--heading-color)]" x-text="storyData.author.name"></p>
                                <span x-show="storyData.story.completed" class="px-2 py-0.5 text-[10px] font-bold uppercase bg-[var(--success-bg)] text-[var(--success-text)] border border-[var(--success-border)] rounded">Completed</span>
                                <span x-show="!storyData.story.completed" class="px-2 py-0.5 text-[10px] font-bold uppercase bg-[var(--info-bg)] text-[var(--info-text)] border border-[var(--info-border)] rounded">Ongoing</span>
                                <span x-show="storyData.moderation.mature" class="px-2 py-0.5 text-[10px] font-bold uppercase bg-[var(--error-bg)] text-[var(--error-text)] border border-[var(--error-border)] rounded">Mature</span>
                                <span class="px-2 py-0.5 text-[10px] font-bold uppercase bg-[var(--bg-color)] text-[var(--subtle-text-color)] rounded border border-[var(--card-border)]" x-text="storyData.story.language?.name || 'Unknown'"></span>
                            </div>

                            <p class="text-sm text-[var(--subtle-text-color)] leading-relaxed font-serif whitespace-pre-line" x-text="storyData.story.description"></p>
                        </div>
                    </div>
                </template>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="p-4 rounded-xl bg-[var(--secondary-bg-color)] border border-[var(--card-border)] shadow-sm flex flex-col items-center justify-center text-center">
                    <p class="text-[10px] uppercase font-bold text-[var(--subtle-text-color)] tracking-wider mb-1">Reads</p>
                    <p class="text-xl font-black text-[var(--heading-color)]" x-text="formatNumber(storyData.stats.reads)"></p>
                </div>
                <div class="p-4 rounded-xl bg-[var(--secondary-bg-color)] border border-[var(--card-border)] shadow-sm flex flex-col items-center justify-center text-center">
                    <p class="text-[10px] uppercase font-bold text-[var(--subtle-text-color)] tracking-wider mb-1">Votes</p>
                    <p class="text-xl font-black text-[var(--heading-color)]" x-text="formatNumber(storyData.stats.votes)"></p>
                </div>
                <div class="p-4 rounded-xl bg-[var(--secondary-bg-color)] border border-[var(--card-border)] shadow-sm flex flex-col items-center justify-center text-center">
                    <p class="text-[10px] uppercase font-bold text-[var(--subtle-text-color)] tracking-wider mb-1">Comments</p>
                    <p class="text-xl font-black text-[var(--heading-color)]" x-text="formatNumber(storyData.stats.comments)"></p>
                </div>
                <div class="p-4 rounded-xl bg-[var(--secondary-bg-color)] border border-[var(--card-border)] shadow-sm flex flex-col items-center justify-center text-center">
                    <p class="text-[10px] uppercase font-bold text-[var(--subtle-text-color)] tracking-wider mb-1">Words (Est)</p>
                    <p class="text-xl font-black text-[var(--heading-color)]" x-text="formatNumber(storyData.stats.words)"></p>
                </div>
            </div>

            <div class="bg-[var(--secondary-bg-color)] rounded-2xl shadow-sm border border-[var(--card-border)] p-5">
                <div class="flex flex-wrap gap-2">
                    <template x-for="category in (storyData.story.categories || [])" :key="category.id">
                        <span class="px-3 py-1 text-xs font-semibold rounded-full bg-[var(--info-bg)] text-[var(--info-text)] border border-[var(--info-border)]" x-text="category.name"></span>
                    </template>
                    <template x-for="tag in (storyData.story.storyTags || [])" :key="tag.id || tag.name">
                        <span class="px-3 py-1 text-xs font-semibold rounded-full bg-[var(--tag-bg)] text-[var(--tag-text)] border border-[var(--tag-border)]" x-text="tag.name"></span>
                    </template>
                    <span x-show="!(storyData.story.categories?.length || storyData.story.storyTags?.length)" class="text-sm text-[var(--subtle-text-color)]">No tags available</span>
                </div>
            </div>

            <div class="bg-[var(--secondary-bg-color)] rounded-2xl shadow-sm border border-[var(--card-border)] overflow-hidden max-h-[560px] flex flex-col">
                <div class="overflow-y-auto p-3 bg-[var(--bg-color)] custom-scrollbar flex-1">
                    <ul class="space-y-2">
                        <template x-for="(part, index) in (storyData ? storyData.chapters : [])" :key="part.id">
                            <li class="flex items-center gap-4 p-4 rounded-xl border transition-colors cursor-pointer"
                                :class="selectedIds.includes(String(part.id)) ? 'bg-[var(--secondary-bg-color)] border-primary-500 shadow-sm' : 'bg-[var(--card-bg)] border-[var(--card-border)] hover:bg-[var(--secondary-bg-color)]'"
                                @click="toggleId(String(part.id))">
                                <div class="relative flex items-center">
                                    <input type="checkbox" :value="String(part.id)" x-model="selectedIds" class="chapter-checkbox pointer-events-none">
                                </div>
                                <div class="flex-1 min-w-0">
                                    <a :href="part.url" target="_blank" rel="noopener noreferrer" class="font-semibold text-sm truncate text-primary-500 hover:underline block" x-text="part.title" @click.stop></a>
                                    <div class="text-xs text-[var(--subtle-text-color)] mt-1 flex flex-wrap items-center gap-x-2 gap-y-1">
                                        <span><span class="font-bold" x-text="'Part: ' + (index + 1)"></span></span>
                                        <span class="text-[var(--separator-color)]">|</span>
                                        <span>ID: <span x-text="part.id"></span></span>
                                        <span class="text-[var(--separator-color)]">|</span>
                                        <span>Words: <span x-text="formatNumber(part.length)"></span></span>
                                        <span class="text-[var(--separator-color)]">|</span>
                                        <span>Date: <span x-text="part.formattedCreatedAt || part.createdAt || 'Unknown'"></span></span>
                                        <template x-if="part.isNew">
                                            <>
                                                <span class="text-[var(--separator-color)]">|</span>
                                                <span class="text-primary-600">New</span>
                                            </>
                                        </template>
                                        <template x-if="part.draft">
                                            <>
                                                <span class="text-[var(--separator-color)]">|</span>
                                                <span class="text-[var(--error-text)]">Draft</span>
                                            </>
                                        </template>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div>
                <div class="p-4 bg-[var(--secondary-bg-color)] border-t border-[var(--separator-color)]">
                    <div class="flex flex-col lg:flex-row gap-3 items-stretch lg:items-center">
                        <div class="flex items-center gap-3">
                            <span class="text-sm text-[var(--subtle-text-color)]">
                                <span class="font-semibold text-[var(--heading-color)]" x-text="selectedIds.length"></span> selected
                            </span>
                            <button @click="toggleSelectAll(true)" class="px-3 py-2 text-xs font-semibold rounded-lg bg-[var(--button-muted-bg)] text-[var(--button-muted-text)] border border-[var(--button-muted-border)] hover:brightness-95 transition">Select All</button>
                            <button @click="toggleSelectAll(false)" class="px-3 py-2 text-xs font-semibold rounded-lg bg-[var(--button-muted-bg)] text-[var(--button-muted-text)] border border-[var(--button-muted-border)] hover:brightness-95 transition">Clear</button>
                        </div>
                        <div class="flex gap-2 lg:ml-auto lg:max-w-sm">
                            <input type="text" x-model="chapterRangeInput" @keydown.enter.prevent="applyChapterRange()" placeholder="1-5, 8, 11-13" class="flex-1 px-3 py-2 text-sm bg-[var(--input-bg-color)] border border-[var(--input-border-color)] rounded-lg focus:ring-1 focus:ring-primary-500" />
                            <button @click="applyChapterRange()" class="px-3 py-2 text-xs font-semibold rounded-lg bg-[var(--button-muted-bg)] text-[var(--button-muted-text)] border border-[var(--button-muted-border)] hover:brightness-95 transition whitespace-nowrap">Apply</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bottom-0 left-0 right-0 z-30 px-3 sm:px-6 lg:px-8 pb-3 sm:pb-6">
                <div class="max-w-5xl mx-auto">
                    <div class="bg-[var(--secondary-bg-color)] rounded-2xl shadow-xl border border-[var(--card-border)] overflow-visible">
                        <div x-show="statusMessage" x-transition class="bg-[var(--info-bg)] text-[var(--info-text)] border-b border-[var(--info-border)] text-xs font-bold py-2 px-4 shadow-sm flex items-center gap-2" style="display: none;">
                        <i data-lucide="loader" class="w-3 h-3 animate-spin"></i>
                        <span x-text="statusMessage"></span>
                        </div>

                        <div class="p-4 flex flex-col gap-4">
                            <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-4">
                                <div class="flex flex-col sm:flex-row sm:flex-wrap items-stretch sm:items-center gap-3 w-full md:w-auto md:flex-1">
                                    <button @click="fetchChapters()" :disabled="isLoadingAny || !selectedIds.length" class="md:w-auto min-h-11 bg-[var(--bg-color)] hover:bg-black/5 dark:hover:bg-white/10 text-[var(--heading-color)] px-5 py-2.5 rounded-xl font-bold disabled:opacity-50 transition flex items-center justify-center gap-2 border border-[var(--card-border)]">
                                        <i data-lucide="download" class="w-4 h-4"></i>
                                        Fetch
                                    </button>

                                    <div class="w-full sm:w-auto flex flex-col sm:flex-row gap-2 sm:gap-0 sm:rounded-xl shadow-sm">
                                        <div class="relative flex-1 sm:flex-none" @keydown.escape.window="showPromptMenu = false">
                                            <button @click="showPromptMenu = !showPromptMenu" type="button" class="w-full sm:min-w-[190px] h-[42px] bg-[var(--bg-color)] border border-[var(--input-border-color)] sm:border-y sm:border-l sm:border-r-0 text-[var(--text-color)] text-sm rounded-xl sm:rounded-l-xl sm:rounded-r-none px-3 py-2.5 outline-none flex items-center justify-between gap-3 hover:border-primary-500 transition">
                                                <span class="truncate" x-text="CONFIG.PROMPTS[selectedPromptKey]?.label || 'Select prompt'"></span>
                                                <i data-lucide="chevrons-up-down" class="w-4 h-4 text-[var(--subtle-text-color)]"></i>
                                            </button>
                                            <div x-show="showPromptMenu" x-transition @click.outside="showPromptMenu = false" class="absolute bottom-full left-0 mb-2 w-full min-w-[220px] rounded-xl border border-[var(--card-border)] bg-[var(--secondary-bg-color)] shadow-xl overflow-hidden z-40" style="display: none;">
                                                <div class="max-h-64 overflow-y-auto custom-scrollbar p-2">
                                                    <template x-for="(prompt, key) in CONFIG.PROMPTS" :key="key">
                                                        <button type="button" @click="selectedPromptKey = key; showPromptMenu = false; refreshIcons()" class="w-full text-left px-3 py-2.5 rounded-lg text-sm transition flex items-center justify-between gap-3"
                                                            :class="selectedPromptKey === key ? 'bg-primary-100/80 dark:bg-primary-500/15 text-primary-700 dark:text-primary-400' : 'text-[var(--text-color)] hover:bg-[var(--bg-color)]'">
                                                            <span class="truncate" x-text="prompt.label"></span>
                                                            <i x-show="selectedPromptKey === key" data-lucide="check" class="w-4 h-4"></i>
                                                        </button>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>

                                        <template x-if="currentPromptPlaceholder">
                                            <div class="flex flex-col sm:flex-row gap-2 md:gap-0 flex-1">
                                                <div x-show="currentPromptPlaceholderOptions.length" class="relative flex-1 sm:flex-none min-w-0" @keydown.escape.window="showPlaceholderMenu = false">

                                    <button @click="downloadMarkdown()" :disabled="!storyData" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-3 py-2 md:p-2 bg-[var(--bg-color)] md:bg-transparent border border-[var(--card-border)] md:border-0 rounded-lg text-[var(--subtle-text-color)] hover:text-primary-600 transition" title="Download File">
                                        <i data-lucide="file-down" class="w-5 h-5"></i>
                                        <span class="text-xs font-semibold md:hidden">Download</span>

                                </div>
                            </div>
                        </div>

                        <div x-show="hasFetchedChapters" class="border-t border-[var(--separator-color)] pt-4" style="display: none;">
                            <div class="flex flex-col gap-3">
                                <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-[var(--subtle-text-color)]">
                                    <i data-lucide="git-branch" class="w-4 h-4 text-primary-600"></i>
                                    Workflow Threads
                                </div>
                                <div class="space-y-2">
                                    <button @click="activateGlobalSource()" class="w-full text-left px-3 py-2.5 rounded-xl border text-sm font-semibold transition flex items-center justify-between gap-3"
                                        :class="activeGlobalRunId === null ? 'bg-primary-100/80 dark:bg-primary-500/15 text-primary-700 dark:text-primary-400 border-primary-200 dark:border-primary-500/20' : 'bg-[var(--bg-color)] text-[var(--subtle-text-color)] border-[var(--card-border)] hover:text-[var(--heading-color)]'">
                                        <span>Source</span>
                                        <span class="text-[10px] uppercase tracking-wide">Original</span>
                                    </button>
                                    <template x-for="run in workflowRuns" :key="run.id">
                                        <button @click="activateGlobalRun(run.id)" class="w-full text-left px-3 py-2.5 rounded-xl border text-sm font-semibold transition flex items-center justify-between gap-3"
                                            :class="activeGlobalRunId === run.id ? 'bg-primary-100/80 dark:bg-primary-500/15 text-primary-700 dark:text-primary-400 border-primary-200 dark:border-primary-500/20' : 'bg-[var(--bg-color)] text-[var(--subtle-text-color)] border-[var(--card-border)] hover:text-[var(--heading-color)]'">

            </div>

            <div x-show="hasAnyContent" class="space-y-10 pb-40 pt-6">
                <template x-for="part in (storyData ? storyData.chapters : [])" :key="part.id">
                    <div x-show="chapterWorkflows[part.id]?.sourceHtml" class="max-w-3xl mx-auto">
                        
                        <div class="flex flex-col md:flex-row md:items-baseline md:justify-between gap-3 border-b-2 border-primary-100 dark:border-primary-500/20 pb-4 mb-6">
                            <h3 class="text-xl md:text-2xl font-bold font-serif text-[var(--heading-color)]" x-text="part.title"></h3>
                            <div class="flex flex-wrap items-center gap-2">
                                <span x-show="['queued', 'processing', 'generating'].includes(getActiveNode(String(part.id))?.stage)" class="inline-flex items-center gap-1.5 text-xs font-semibold text-[var(--subtle-text-color)]">
                                    <i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i>
                                    <span x-text="getActiveNode(String(part.id))?.statusLabel"></span>
                                </span>
                                <span x-show="getActiveNode(String(part.id))?.isAi && getActiveNode(String(part.id))?.stage === 'done'" class="text-[10px] font-bold bg-[var(--tag-bg)] text-[var(--tag-text)] px-2 py-1 rounded-full border border-[var(--tag-border)] uppercase">
                                    <i data-lucide="sparkles" class="w-3 h-3 inline mr-1"></i> AI Enhanced
                                </span>
                                <span class="text-[10px] font-bold px-2 py-1 rounded-full border uppercase"
                                    :class="getNodeScopeClasses(getActiveNode(String(part.id))?.scope)"

                                <button @click="toggleChapterHistory(String(part.id))" :disabled="!chapterWorkflows[part.id]" class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-bold rounded-full bg-[var(--bg-color)] text-[var(--heading-color)] border border-[var(--card-border)] hover:bg-black/5 dark:hover:bg-white/10 disabled:opacity-50 transition uppercase">

                                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>

                        <div x-show="chapterWorkflows[part.id]?.showHistory" class="mb-6 rounded-2xl border border-[var(--card-border)] bg-[var(--secondary-bg-color)] p-4 space-y-3" style="display: none;">

                            <div class="space-y-2">
                                <template x-for="node in getChapterHistory(String(part.id))" :key="node.id">
                                    <div class="rounded-xl border p-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3"
                                        :class="chapterWorkflows[part.id]?.activeNodeId === node.id ? 'border-primary-200 dark:border-primary-500/30 bg-primary-50/60 dark:bg-primary-500/10' : 'border-[var(--card-border)] bg-[var(--bg-color)]'">
                                        <div class="space-y-1">
                                            <div class="flex flex-wrap items-center gap-2">
                                                <span class="text-sm font-semibold text-[var(--heading-color)]" x-text="getNodeDisplayName(node)"></span>
                                                <span class="text-[10px] font-bold px-2 py-1 rounded-full border uppercase"
                                                    :class="getNodeScopeClasses(node.scope)"
                                                    x-text="getNodeScopeLabel(node.scope)"></span>
                                                <span x-show="chapterWorkflows[part.id]?.activeNodeId === node.id" class="text-[10px] font-bold px-2 py-1 rounded-full border border-primary-200 dark:border-primary-500/30 bg-primary-100/80 dark:bg-primary-500/15 text-primary-700 dark:text-primary-400 uppercase">Active</span>
                                            </div>
                                            <p class="text-xs text-[var(--subtle-text-color)]" x-text="getNodeMetaLine(node, String(part.id))"></p>
                                        </div>
                                        <button @click="setActiveChapterNode(String(part.id), node.id)" class="md:w-auto px-3 py-2 rounded-full text-xs font-semibold border border-[var(--card-border)] bg-[var(--secondary-bg-color)] text-[var(--heading-color)] hover:bg-black/5 dark:hover:bg-white/10 transition">Rollback</button>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="prose prose-lg dark:prose-invert prose-stone font-serif max-w-none leading-relaxed">
                             <div x-html="getChapterDisplayHtml(String(part.id))"></div>
